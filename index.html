<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chạm — Không gian đọc truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
      :root {
        --cream: #fdfcf9;
        --cream-2: #f5f3ee;
        --ink: #1a1814;
        --ink-2: #4a4640;
        --ink-3: #8c877f;
        --amber: #c27b2a;
        --amber-light: #f5e6d0;
        --border: #e8e4dc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--cream);
        color: var(--ink);
      }
      .font-lora {
        font-family: "Lora", serif;
      }

      nav {
        background: var(--cream);
        border-bottom: 1px solid var(--border);
      }
      .nav-logo {
        font-family: "Lora", serif;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.5px;
      }
      .nav-link {
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s;
      }
      .nav-link:hover {
        color: var(--ink);
      }
      .btn-primary {
        background: var(--ink);
        color: white;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 16px;
        border-radius: 6px;
        text-decoration: none;
        transition: background 0.2s;
        display: inline-block;
      }
      .btn-primary:hover {
        background: var(--ink-2);
      }

      .hero {
        background: var(--cream);
        border-bottom: 1px solid var(--border);
        padding: 56px 0 48px;
      }
      .hero-eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: var(--amber);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .hero-title {
        font-family: "Lora", serif;
        font-size: 32px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.3;
        margin-bottom: 10px;
      }
      .hero-sub {
        font-size: 14px;
        color: var(--ink-3);
        line-height: 1.6;
      }

      .section-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .book-card {
        text-decoration: none;
        display: block;
        cursor: pointer;
        width: 100%;
      }

      .book-cover {
        width: 100% !important;
        height: 240px !important;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 10px;
        background: var(--cream-2);
        border: 1px solid var(--border);
        position: relative;
        transition:
          box-shadow 0.25s,
          transform 0.25s;
      }
      @media (min-width: 768px) {
        .book-cover {
          height: 340px !important;
        }
      }
      .book-card:hover .book-cover {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
      }
      .book-cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover !important;
        display: block;
      }

      /* Nhãn hiển thị số chương và lượt xem */
      .book-badge {
        position: absolute;
        bottom: 7px;
        left: 7px;
        background: rgba(26, 24, 20, 0.75);
        backdrop-filter: blur(6px);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 5px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .history-badge {
        position: absolute;
        top: 7px;
        left: 7px;
        background: var(--amber);
        color: white;
        font-size: 9px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 4px;
        z-index: 10;
      }
      .history-label {
        font-size: 11px;
        color: var(--amber);
        font-weight: 600;
        margin-top: 3px;
      }

      .book-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .book-author {
        font-size: 11px;
        color: var(--ink-3);
      }

      .add-card {
        width: 100%;
        height: 240px !important;
        border-radius: 8px;
        border: 1.5px dashed var(--border);
        position: relative;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
        text-decoration: none;
      }
      @media (min-width: 768px) {
        .add-card {
          height: 340px !important;
        }
      }
      .add-card:hover {
        border-color: var(--amber);
        background: var(--amber-light);
      }
      .add-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .add-icon {
        font-size: 20px;
        color: var(--ink-3);
      }
      .add-text {
        font-size: 11px;
        color: var(--ink-3);
        font-weight: 500;
      }

      .reading-mode-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--cream-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 11px;
      }
      .reading-mode-pill select {
        background: transparent;
        border: none;
        outline: none;
        color: var(--ink-2);
        font-weight: 600;
        cursor: pointer;
        font-size: 11px;
      }

      /* 🔔 STYLE HỘP THOẠI THÔNG BÁO THẢ XUỐNG */
      .noti-dropdown {
        display: none;
        position: absolute;
        right: 0;
        top: 42px;
        width: 300px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(26, 24, 20, 0.08);
        z-index: 100;
        overflow: hidden;
      }
      .noti-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--cream-2);
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .noti-item:last-child {
        border-bottom: none;
      }
      .noti-date {
        font-size: 10px;
        color: var(--ink-3);
        font-weight: 600;
        margin-top: 4px;
        display: block;
      }
    </style>
  </head>
  <body>
    <nav style="position: sticky; top: 0; z-index: 50">
      <div
        class="max-w-[1100px] mx-auto px-4 md:px-6 h-[54px] flex items-center justify-between relative"
      >
        <a
          href="index.html"
          class="nav-logo"
          style="font-size: 18px; text-decoration: none"
          >Chạm</a
        >
        <div style="display: flex; align-items: center; gap: 16px; gap: 20px">
          <a href="index.html" class="nav-link hidden md:inline">Khám phá</a>
          <a href="editor.html" class="nav-link">Sáng tác</a>
          <div class="reading-mode-pill hidden md:flex">
            <span style="color: var(--ink-3)">Đọc:</span>
            <select
              id="global-reading-mode"
              onchange="saveGlobalReadingMode(this.value)"
            >
              <option value="vertical">Cuộn dọc</option>
              <option value="horizontal">Lật ngang</option>
            </select>
          </div>

          <!-- 🔔 ICON CHUÔNG THÔNG BÁO REAL-TIME -->
          <div class="relative flex items-center">
            <button
              onclick="toggleNotificationDropdown(event)"
              class="relative p-1.5 rounded-full hover:bg-stone-100 transition text-stone-700 outline-none"
              id="btn-noti-bell"
            >
              <span class="text-xl">🔔</span>
              <span
                id="noti-badge"
                class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-white hidden"
              ></span>
            </button>

            <div id="noti-box" class="noti-dropdown">
              <div
                class="px-4 py-2.5 bg-stone-50 border-b border-stone-200 text-[10px] font-bold text-stone-500 uppercase tracking-wider"
              >
                Thông báo từ Chạm
              </div>
              <div id="noti-content-list" class="max-h-[320px] overflow-y-auto">
                <div class="text-center py-6 text-xs text-stone-400 italic">
                  Chạm chưa có thông báo mới...
                </div>
              </div>
            </div>
          </div>

          <a href="editor.html" class="btn-primary">Viết tiếp</a>
        </div>
      </div>
    </nav>

    <div class="hero px-4 text-center md:text-left">
      <div style="max-width: 1100px; margin: 0 auto">
        <div class="hero-eyebrow">Kệ sách chữa lành</div>
        <h1 class="hero-title text-2xl md:text-3xl">
          Nơi những câu truyện thú vị<br />được quan sát qua nhiều vũ trụ khác
          nhau
        </h1>
      </div>
    </div>

    <main style="max-width: 1100px; margin: 0 auto" class="px-4 py-8 md:py-12">
      <div
        id="reading-history-section"
        style="display: none"
        class="mb-10 md:mb-14"
      >
        <div class="section-label">Đang đọc dở</div>
        <div
          class="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-5 items-start"
          id="history-list-grid"
        ></div>
      </div>

      <div>
        <div class="section-label">Tất cả tác phẩm</div>
        <div
          class="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-5 items-start"
          id="story-list-grid"
        >
          <div
            style="
              grid-column: 1/-1;
              text-align: center;
              color: var(--ink-3);
              padding: 48px 0;
              font-size: 14px;
            "
          >
            Đang kết nối...
          </div>
        </div>
      </div>
    </main>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f",
      };
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      function saveGlobalReadingMode(val) {
        localStorage.setItem("tramnang_default_reading_mode", val);
      }

      window.addEventListener("DOMContentLoaded", () => {
        const savedMode =
          localStorage.getItem("tramnang_default_reading_mode") || "vertical";
        const globalSelect = document.getElementById("global-reading-mode");
        if (globalSelect) globalSelect.value = savedMode;
      });

      function toggleNotificationDropdown(e) {
        e.stopPropagation();
        const notiBox = document.getElementById("noti-box");
        const badge = document.getElementById("noti-badge");

        if (notiBox.style.display === "block") {
          notiBox.style.display = "none";
        } else {
          notiBox.style.display = "block";
          badge.classList.add("hidden");
          localStorage.setItem("tramnang_last_seen_noti", new Date().getTime());
        }
      }

      document.addEventListener("click", () => {
        document.getElementById("noti-box").style.display = "none";
      });

      database.ref("announcements").on("value", (snapshot) => {
        const listContainer = document.getElementById("noti-content-list");
        const badge = document.getElementById("noti-badge");
        const data = snapshot.val();

        if (!data) {
          listContainer.innerHTML =
            '<div class="text-center py-6 text-xs text-stone-400 italic">Trạm chưa có thông báo mới...</div>';
          return;
        }

        listContainer.innerHTML = "";
        const sortedIds = Object.keys(data).sort(
          (a, b) =>
            parseInt(b.replace("id_", "")) - parseInt(a.replace("id_", "")),
        );

        let hasNewNoti = false;
        const lastSeen = localStorage.getItem("tramnang_last_seen_noti") || 0;

        sortedIds.forEach((id) => {
          const item = data[id];
          listContainer.innerHTML += `
                <div class="noti-item">
                    <div class="font-medium text-stone-800">${item.content}</div>
                    <span class="noti-date">🕒 ${item.date || "Vừa xong"}</span>
                </div>
            `;
          if (item.timestamp && item.timestamp > lastSeen) {
            hasNewNoti = true;
          }
        });

        if (hasNewNoti) {
          badge.classList.remove("hidden");
        }
      });

      function renderReadingHistory(allStories) {
        const section = document.getElementById("reading-history-section");
        const grid = document.getElementById("history-list-grid");
        const localHistory =
          JSON.parse(localStorage.getItem("wattpad_reading_history")) || {};
        if (!Object.keys(localHistory).length || !allStories) {
          section.style.display = "none";
          return;
        }

        let hasValid = false;
        grid.innerHTML = "";
        Object.keys(localHistory).forEach((storyId) => {
          if (allStories[storyId]?.story_info) {
            hasValid = true;
            const story = allStories[storyId].story_info;
            const lastCh = localHistory[storyId].chapter;
            const cover =
              story.cover ||
              "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
            const chapters = allStories[storyId].chapters;
            const chCount = chapters ? Object.keys(chapters).length : 0;
            const viewsCount = story.views || 0;

            let statusLabel =
              story.status === "completed"
                ? '<span class="text-[10px] bg-green-100 text-green-700 px-1 rounded font-bold flex-shrink-0">✓ Xong</span>'
                : '<span class="text-[10px] bg-amber-100 text-amber-700 px-1 rounded font-bold flex-shrink-0">⏳Chưa hoàn thành</span>';

            grid.innerHTML += `
                <a href="read.html?id=${storyId}&ch=${lastCh}" class="book-card">
                    <div class="book-cover">
                        <img src="${cover}" alt="">
                        
                        <div class="book-badge">
                            
                            <span>👁️ ${viewsCount}</span>
                        </div>
                    </div>
                    <div  <span class="truncate">${story.title}</span></div>
                    <div class="history-label">Đọc tiếp →</div>
                </a>`;
          }
        });
        section.style.display = hasValid ? "block" : "none";
      }

      database.ref("stories").on("value", (snapshot) => {
        const grid = document.getElementById("story-list-grid");
        grid.innerHTML = "";
        const allStories = snapshot.val();
        renderReadingHistory(allStories);

        if (!allStories) {
          grid.innerHTML = `<a href="editor.html" class="add-card"><div class="add-content"><div class="add-icon">+</div><div class="add-text">Thêm truyện</div></div></a>`;
          return;
        }
        Object.keys(allStories).forEach((storyId) => {
          const story = allStories[storyId].story_info;
          if (!story) return;
          const cover =
            story.cover ||
            "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
          const chapters = allStories[storyId].chapters;
          const chCount = chapters ? Object.keys(chapters).length : 0;
          const viewsCount = story.views || 0;

          let statusLabel =
            story.status === "completed"
              ? '<span class="text-[10px] bg-green-100 text-green-700 px-1 rounded font-bold flex-shrink-0">✓ Xong</span>'
              : '<span class="text-[10px] bg-amber-100 text-amber-700 px-1 rounded font-bold flex-shrink-0">Chưa hoàn thành</span>';

          grid.innerHTML += `
            <a href="detail.html?id=${storyId}" class="book-card">
                <div class="book-cover">
                    <img src="${cover}" alt="">
                    <div class="book-badge">
                        <span>${chCount} chương</span>
                        <span style="opacity:0.5;">|</span>
                        <span>👁️ ${viewsCount}</span>
                    </div>
                </div>
                <div class="book-title">${statusLabel} <span class="truncate">${story.title}</span></div>
                <div class="book-author">${story.author || "Khuyết danh"}</div>
            </a>`;
        });
        grid.innerHTML += `<a href="editor.html" class="add-card"><div class="add-content"><div class="add-icon">+</div><div class="add-text">Thêm truyện</div></div></a>`;
      });
    </script>
  </body>
</html>
