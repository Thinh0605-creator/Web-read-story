<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wattpad Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-story { font-family: 'Merriweather', serif; }
        .book-card:hover img { transform: scale(1.05); transition: 0.3s; }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-orange-600 tracking-tighter">WATTPAD-CLONE</a>
            <div class="hidden md:flex space-x-6 text-gray-600 font-medium">
                <a href="index.html" class="hover:text-orange-600">Khám phá</a>
                <a href="editor.html" class="hover:text-orange-600">Viết truyện</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="editor.html" class="bg-orange-500 text-white px-5 py-2 rounded-full font-bold hover:bg-orange-600 transition shadow-sm text-sm">
                    ✍️ Tạo / Viết tiếp truyện
                </a>
            </div>
        </div>
    </nav>

    <header class="bg-gradient-to-r from-orange-400 to-rose-400 py-16 text-white text-center">
        <h2 class="text-4xl font-bold mb-4">Nơi những câu chuyện bắt đầu</h2>
        <p class="text-lg opacity-90">Đăng tải và chia sẻ tác phẩm của chính bạn.</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10 space-y-12">
        
        <div id="reading-history-section" class="hidden">
            <h3 class="text-2xl font-bold mb-6 flex items-center">
                <span class="bg-orange-500 w-2 h-8 mr-3 rounded-full"></span>
                📚 Truyện cậu đang đọc dở
            </h3>
            <div id="history-list-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>

        <div>
            <h3 class="text-2xl font-bold mb-6 flex items-center">
                <span class="bg-orange-500 w-2 h-8 mr-3 rounded-full"></span>
                Truyện mới trên hệ thống
            </h3>
            <div id="story-list-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <div class="col-span-full text-center text-gray-400 py-10">⏳ Đang kết nối vũ trụ lấy truyện về...</div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
            authDomain: "web-read-story.firebaseapp.com",
            databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
            projectId: "web-read-story",
            storageBucket: "web-read-story.firebasestorage.app",
            messagingSenderId: "627619633534",
            appId: "1:627619633534:web:428659f610e2eb7c45bb2f"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function renderReadingHistory(allStories) {
            const historySection = document.getElementById('reading-history-section');
            const historyGrid = document.getElementById('history-list-grid');
            const localHistory = JSON.parse(localStorage.getItem('wattpad_reading_history')) || {};
            
            if (Object.keys(localHistory).length === 0 || !allStories) {
                historySection.classList.add('hidden'); return;
            }

            let hasValidHistory = false;
            historyGrid.innerHTML = "";

            Object.keys(localHistory).forEach((storyId) => {
                if (allStories[storyId] && allStories[storyId].story_info) {
                    hasValidHistory = true;
                    const story = allStories[storyId].story_info;
                    const lastCh = localHistory[storyId].chapter;
                    const coverImg = story.cover || "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
                    
                    const card = `
                        <a href="read.html?id=${storyId}&ch=${lastCh}" class="book-card group cursor-pointer block relative">
                            <span class="absolute top-2 left-2 bg-orange-600 text-white font-bold text-xs px-2 py-1 rounded-md z-30 shadow">Đọc tiếp Ch. ${lastCh}</span>
                            <div class="overflow-hidden rounded-lg shadow-lg aspect-[2/3] mb-3 bg-gray-100">
                                <img src="${coverImg}" alt="Cover" class="w-full h-full object-cover opacity-90 transition duration-300">
                            </div>
                            <h4 class="font-bold text-gray-800 group-hover:text-orange-600 line-clamp-1">${story.title}</h4>
                            <p class="text-xs text-orange-500 font-semibold">Bấm để đọc tiếp ngay →</p>
                        </a>
                    `;
                    historyGrid.innerHTML += card;
                }
            });

            if (hasValidHistory) { historySection.classList.remove('hidden'); }
            else { historySection.classList.add('hidden'); }
        }

        database.ref('stories').on('value', (snapshot) => {
            const grid = document.getElementById('story-list-grid');
            grid.innerHTML = "";
            const allStories = snapshot.val();
            
            renderReadingHistory(allStories);

            if (!allStories) {
                grid.innerHTML = `
                    <a href="editor.html" class="book-card group cursor-pointer block border-2 border-dashed border-gray-300 rounded-lg p-4 flex flex-col items-center justify-center text-center hover:border-orange-500 transition aspect-[2/3] bg-white">
                        <span class="text-3xl mb-2 text-gray-400">➕</span>
                        <h4 class="font-bold text-gray-500 text-sm">Chưa có bản thảo nào</h4>
                        <p class="text-xs text-gray-400 mt-1">Bấm vào để thêm bản thảo mới!</p>
                    </a>`;
                return;
            }

            Object.keys(allStories).forEach((storyId) => {
                const story = allStories[storyId].story_info;
                if(story) {
                    const coverImg = story.cover || "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
                    const htmlCard = `
                        <a href="detail.html?id=${storyId}" class="book-card group cursor-pointer block">
                            <div class="overflow-hidden rounded-lg shadow-lg aspect-[2/3] mb-3 bg-gray-100">
                                <img src="${coverImg}" alt="Cover" class="w-full h-full object-cover transition duration-300">
                            </div>
                            <h4 class="font-bold text-gray-800 group-hover:text-orange-600 line-clamp-1">${story.title}</h4>
                            <p class="text-sm text-gray-500 italic line-clamp-1">Tác giả: ${story.author || 'Khuyết danh'}</p>
                            <div class="flex items-center mt-2 text-xs text-gray-400">
                                <span class="mr-2">👁️ ${story.views || 0} lượt đọc</span>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += htmlCard;
                }
            });

            grid.innerHTML += `
                <a href="editor.html" class="book-card group cursor-pointer block border-2 border-dashed border-gray-300 rounded-lg p-4 flex flex-col items-center justify-center text-center hover:border-orange-500 transition aspect-[2/3] bg-white">
                    <span class="text-3xl mb-2 text-gray-400 group-hover:text-orange-500 transition">➕</span>
                    <h4 class="font-bold text-gray-500 group-hover:text-orange-500 transition text-sm">Thêm bản thảo</h4>
                    <p class="text-xs text-gray-400 mt-1">Sáng tác truyện mới nhanh chóng</p>
                </a>`;
        });
    </script>
</body>
</html>
