<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chạm — Không gian đọc truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
      :root {
        --cream: #fdfcf9;
        --cream-2: #f5f3ee;
        --ink: #1a1814;
        --ink-2: #4a4640;
        --ink-3: #8c877f;
        --amber: #c27b2a;
        --amber-light: #f5e6d0;
        --border: #e8e4dc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--cream);
        color: var(--ink);
      }
      .font-lora {
        font-family: "Lora", serif;
      }
      nav {
        background: var(--cream);
        border-bottom: 1px solid var(--border);
      }
      .nav-logo {
        font-family: "Lora", serif;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.5px;
      }
      .nav-link {
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s;
      }
      .nav-link:hover {
        color: var(--ink);
      }
      .btn-primary {
        background: var(--ink);
        color: white;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 16px;
        border-radius: 6px;
        text-decoration: none;
        transition: background 0.2s;
        display: inline-block;
      }
      .btn-primary:hover {
        background: var(--ink-2);
      }
      .hero {
        background: var(--cream);
        border-bottom: 1px solid var(--border);
        padding: 56px 0 48px;
      }
      .hero-eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: var(--amber);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .hero-title {
        font-family: "Lora", serif;
        font-size: 32px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.3;
        margin-bottom: 10px;
      }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .book-card {
        text-decoration: none;
        display: block;
        cursor: pointer;
        width: 100%;
      }
      .book-cover {
        width: 100% !important;
        height: 240px !important;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 10px;
        background: var(--cream-2);
        border: 1px solid var(--border);
        position: relative;
        transition: box-shadow 0.25s, transform 0.25s;
      }
      @media (min-width: 768px) {
        .book-cover {
          height: 340px !important;
        }
      }
      .book-card:hover .book-cover {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
      }
      .book-cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover !important;
        display: block;
      }
      .book-badge {
        position: absolute;
        bottom: 7px;
        left: 7px;
        background: rgba(26, 24, 20, 0.75);
        backdrop-filter: blur(6px);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 5px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .history-badge {
        position: absolute;
        top: 7px;
        left: 7px;
        background: var(--amber);
        color: white;
        font-size: 9px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 4px;
        z-index: 10;
      }
      .history-label {
        font-size: 11px;
        color: var(--amber);
        font-weight: 600;
        margin-top: 3px;
      }
      .book-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .book-author {
        font-size: 11px;
        color: var(--ink-3);
      }
      .add-card {
        width: 100%;
        height: 240px !important;
        border-radius: 8px;
        border: 1.5px dashed var(--border);
        position: relative;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        text-decoration: none;
      }
      @media (min-width: 768px) {
        .add-card {
          height: 340px !important;
        }
      }
      .add-card:hover {
        border-color: var(--amber);
        background: var(--amber-light);
      }
      .add-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .add-icon {
        font-size: 20px;
        color: var(--ink-3);
      }
      .add-text {
        font-size: 11px;
        color: var(--ink-3);
        font-weight: 500;
      }
      .reading-mode-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--cream-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 11px;
      }
      .reading-mode-pill select {
        background: transparent;
        border: none;
        outline: none;
        color: var(--ink-2);
        font-weight: 600;
        cursor: pointer;
        font-size: 11px;
      }
      .noti-dropdown {
        display: none;
        position: absolute;
        right: 0;
        top: 42px;
        width: 300px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(26, 24, 20, 0.08);
        z-index: 100;
        overflow: hidden;
      }
      .noti-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--cream-2);
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .noti-item:last-child {
        border-bottom: none;
      }
      .noti-date {
        font-size: 10px;
        color: var(--ink-3);
        font-weight: 600;
        margin-top: 4px;
        display: block;
      }
    </style>
  </head>
  <body>
    <nav style="position: sticky; top: 0; z-index: 50">
      <div class="max-w-[1100px] mx-auto px-4 md:px-6 h-[54px] flex items-center justify-between relative">
        <a href="index.html" class="nav-logo" style="font-size: 18px; text-decoration: none">Chạm</a>
        <div style="display: flex; align-items: center; gap: 20px">
          <a href="index.html" class="nav-link hidden md:inline">Khám phá</a>
          <a href="editor.html" id="nav-editor-link" class="nav-link hidden">Sáng tác</a>
          
          <div class="reading-mode-pill hidden md:flex">
            <span style="color: var(--ink-3)">Đọc:</span>
            <select id="global-reading-mode" onchange="saveGlobalReadingMode(this.value)">
              <option value="vertical">Cuộn dọc</option>
              <option value="horizontal">Lật ngang</option>
            </select>
          </div>

          <button onclick="toggleUserAuthModal()" id="btn-user-profile" class="nav-link font-semibold text-stone-700 outline-none">
            👤 Tài khoản
          </button>

          <div class="relative flex items-center">
            <button onclick="toggleNotificationDropdown(event)" class="relative p-1.5 rounded-full hover:bg-stone-100 transition text-stone-700 outline-none" id="btn-noti-bell">
              <span class="text-xl">🔔</span>
              <span id="noti-badge" class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-white hidden"></span>
            </button>

            <div id="noti-box" class="noti-dropdown">
              <div class="px-4 py-2.5 bg-stone-50 border-b border-stone-200 text-[10px] font-bold text-stone-500 uppercase tracking-wider">
                Thông báo từ Chạm
              </div>
              <div id="noti-content-list" class="max-h-[320px] overflow-y-auto">
                <div class="text-center py-6 text-xs text-stone-400 italic">Chạm chưa có thông báo mới...</div>
              </div>
            </div>
          </div>

          <a href="editor.html" id="nav-write-btn" class="btn-primary hidden">Viết tiếp</a>
        </div>
      </div>
    </nav>

    <!-- 🔑 MODAL QUẢN LÝ TÀI KHOẢN & ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="user-auth-modal" class="hidden fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
      <div class="bg-white rounded-xl max-w-sm w-full p-6 border border-stone-200 shadow-xl">
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h3 id="auth-modal-title" class="font-lora font-bold text-lg text-stone-800">Đăng Nhập Độc Giả</h3>
          <button onclick="toggleUserAuthModal()" class="text-stone-400 hover:text-stone-600 text-lg">✕</button>
        </div>
        
        <!-- Form Đăng nhập / Đăng ký -->
        <div id="auth-form-fields" class="space-y-3">
          <div>
            <label id="auth-identity-label" class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">Username hoặc Email</label>
            <input type="text" id="auth-email-or-username" class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-stone-50 outline-none focus:border-amber-600 font-medium">
          </div>
          <div id="email-field-wrapper" class="hidden">
            <label class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">Email</label>
            <input type="email" id="auth-real-email" class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-stone-50 outline-none focus:border-amber-600">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">Mật khẩu</label>
            <input type="password" id="auth-password" class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-stone-50 outline-none focus:border-amber-600">
          </div>
          <div class="pt-2">
            <button id="btn-main-auth" onclick="handleAuthAction()" class="w-full bg-stone-900 text-white font-semibold p-2.5 rounded-lg text-sm transition hover:bg-stone-800">Đăng Nhập</button>
            <button id="btn-switch-auth" onclick="switchAuthMode()" class="w-full text-center text-xs text-amber-700 font-medium mt-3 hover:underline">Chưa có tài khoản? Đăng ký ngay</button>
          </div>
        </div>

        <!-- KHU VỰC QUẢN LÝ TÀI KHOẢN -->
        <div id="auth-logged-fields" class="hidden space-y-4">
          <div class="bg-stone-50 p-3 rounded-lg border border-stone-150 text-xs text-stone-600 space-y-2">
            <div>Email: <strong id="logged-email" class="text-stone-800 font-medium"></strong></div>
            <div>Loại tài khoản: <span id="logged-role" class="px-1.5 py-0.5 bg-stone-200 text-stone-700 font-bold rounded text-[10px]">Độc giả</span></div>
          </div>
          
          <div>
            <label class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">Username</label>
            <div class="flex gap-2">
              <input type="text" id="logged-username-input" class="w-full border border-stone-200 rounded-lg p-2 text-sm bg-white outline-none focus:border-amber-600 font-medium text-stone-800" placeholder="Chưa đặt username">
              <button onclick="updateUsername()" class="bg-amber-600 text-white text-xs font-semibold px-3 rounded-lg hover:bg-amber-700 transition">Lưu</button>
            </div>
          </div>
          
          <div class="pt-2 border-t border-stone-100">
            <button onclick="handleSignOut()" class="w-full bg-red-50 text-red-600 border border-red-200 font-semibold p-2 rounded-lg text-xs transition hover:bg-red-100">Đăng xuất tài khoản</button>
          </div>
        </div>
      </div>
    </div>

    <div class="hero px-4 text-center md:text-left">
      <div style="max-width: 1100px; margin: 0 auto">
        <div class="hero-eyebrow">Kệ sách chữa lành</div>
        <h1 class="hero-title text-2xl md:text-3xl">
          Nơi những câu truyện thú vị<br />được quan sát qua nhiều câu chuyện khác nhau
        </h1>
      </div>
    </div>

    <main style="max-width: 1100px; margin: 0 auto" class="px-4 py-8 md:py-12">
      <div id="reading-history-section" style="display: none" class="mb-10 md:mb-14">
        <div class="section-label">Đang đọc dở</div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-5 items-start" id="history-list-grid"></div>
      </div>

      <div>
        <div class="section-label">Tất cả tác phẩm</div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-5 items-start" id="story-list-grid">
          <div style="grid-column: 1/-1; text-align: center; color: var(--ink-3); padding: 48px 0; font-size: 14px;">
            Đang kết nối...
          </div>
        </div>
      </div>
    </main>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f",
      };
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      let isSignUpMode = false;
      let currentUser = null;
      let isAdmin = false;

      function saveGlobalReadingMode(val) {
        localStorage.setItem("tramnang_default_reading_mode", val);
      }

      window.addEventListener("DOMContentLoaded", () => {
        const savedMode = localStorage.getItem("tramnang_default_reading_mode") || "vertical";
        const globalSelect = document.getElementById("global-reading-mode");
        if (globalSelect) globalSelect.value = savedMode;
      });

      function toggleUserAuthModal() {
        document.getElementById("user-auth-modal").classList.toggle("hidden");
      }

      function switchAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('auth-modal-title').innerText = isSignUpMode ? "Đăng Ký Độc Giả" : "Đăng Nhập Độc Giả";
        document.getElementById('btn-main-auth').innerText = isSignUpMode ? "Đăng Ký" : "Đăng Nhập";
        document.getElementById('btn-switch-auth').innerText = isSignUpMode ? "Đã có tài khoản? Đăng nhập" : "Chưa có tài khoản? Đăng ký ngay";
        
        document.getElementById('email-field-wrapper').style.display = isSignUpMode ? "block" : "none";
        
        document.getElementById('auth-identity-label').innerText = isSignUpMode ? "Username" : "Username hoặc Email";
        document.getElementById('auth-email-or-username').placeholder = isSignUpMode ? "" : "Nhập tên tài khoản hoặc email";
      }

      function handleAuthAction() {
        const inputIdentity = document.getElementById('auth-email-or-username').value.trim();
        const password = document.getElementById('auth-password').value;

        if (!inputIdentity || !password) {
          alert("Điền đầy đủ thông tin giúp tớ nha cậu ơi!");
          return;
        }

        if (isSignUpMode) {
          const email = document.getElementById('auth-real-email').value.trim();
          if (!email) { alert("Cậu nhập thêm địa chỉ Email thực để bảo mật tài khoản nhen!"); return; }

          database.ref('users').once('value').then((snapshot) => {
            const usersData = snapshot.val();
            let isUsernameTaken = false;
            
            if (usersData) {
              Object.keys(usersData).forEach((uid) => {
                if (usersData[uid].profile?.username?.toLowerCase() === inputIdentity.toLowerCase()) {
                  isUsernameTaken = true;
                }
              });
            }

            if (isUsernameTaken) {
              alert("Username này có người dùng mất rồi, cậu chọn tên khác nhen!");
              return;
            }

            firebase.auth().createUserWithEmailAndPassword(email, password)
              .then((credential) => {
                database.ref(`users/${credential.user.uid}/profile`).set({
                  username: inputIdentity,
                  role: "user",
                  email_linked: email
                }).then(() => {
                  alert("Đăng ký tài khoản độc giả thành công nhen!");
                  toggleUserAuthModal();
                });
              }).catch((err) => alert("Lỗi: " + err.message));
          });
        } else {
          if (inputIdentity.includes('@')) {
            loginWithEmailAndPassword(inputIdentity, password);
          } else {
            document.getElementById('btn-main-auth').innerText = "Đang kết nối...";
            
            database.ref('users').once('value').then((snapshot) => {
              const usersData = snapshot.val();
              let foundEmail = null;

              if (usersData) {
                Object.keys(usersData).forEach((uid) => {
                  if (usersData[uid].profile?.username?.toLowerCase() === inputIdentity.toLowerCase()) {
                    foundEmail = usersData[uid].profile.email_linked || usersData[uid].profile.email;
                  }
                });
              }

              if (foundEmail) {
                loginWithEmailAndPassword(foundEmail, password);
              } else {
                alert("Tớ lùng sục khắp nơi mà không thấy Username này của cậu! Thử lại nhen!");
                document.getElementById('btn-main-auth').innerText = "Đăng Nhập";
              }
            });
          }
        }
      }

      function loginWithEmailAndPassword(email, password) {
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then(() => {
            alert("Đăng nhập thành công! Chúc cậu đọc truyện vui vẻ!");
            toggleUserAuthModal();
          }).catch((err) => {
            alert("Mật khẩu hoặc tài khoản chưa chuẩn đét rồi cậu ơi!");
            document.getElementById('btn-main-auth').innerText = "Đăng Nhập";
          });
      }

      function updateUsername() {
        if(!currentUser) return;
        const newUser = document.getElementById("logged-username-input").value.trim();
        if(!newUser) { alert("Username không được để trống nha cậu!"); return; }
        
        database.ref(`users/${currentUser.uid}/profile/username`).set(newUser)
          .then(() => {
            alert("Đã cập nhật tên Username mới thành công!");
            document.getElementById("btn-user-profile").innerText = `👤 ${newUser}`;
          }).catch((err) => alert("Lỗi: " + err.message));
      }

      function handleSignOut() {
        firebase.auth().signOut().then(() => {
          alert("Đã đăng xuất tài khoản.");
          localStorage.removeItem("wattpad_reading_history");
          location.reload();
        });
      }

      firebase.auth().onAuthStateChanged((user) => {
        currentUser = user;
        const btnUser = document.getElementById("btn-user-profile");
        const formFields = document.getElementById("auth-form-fields");
        const loggedFields = document.getElementById("auth-logged-fields");
        const edLink = document.getElementById("nav-editor-link");
        const wtBtn = document.getElementById("nav-write-btn");

        if (user) {
          formFields.classList.add("hidden");
          loggedFields.classList.remove("hidden");
          document.getElementById("logged-email").innerText = user.email;

          database.ref(`users/${user.uid}/profile`).on('value', (snapshot) => {
            const profile = snapshot.val();
            let displayTitle = user.email.split('@')[0];
            let role = "user";

            if (profile) {
              if (profile.username) displayTitle = profile.username;
              if (profile.role) role = profile.role;
            }

            if (user.email === "nguyenhuuthinh0506@gmail.com" || role === "admin") {
              isAdmin = true;
              document.getElementById("logged-role").innerText = "Chủ tiệm (Admin)";
              document.getElementById("logged-role").className = "px-1.5 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px]";
              edLink.classList.remove("hidden");
              wtBtn.classList.remove("hidden");
            } else {
              isAdmin = false;
              document.getElementById("logged-role").innerText = "Độc giả (User)";
              document.getElementById("logged-role").className = "px-1.5 py-0.5 bg-stone-200 text-stone-700 font-bold rounded text-[10px]";
              edLink.classList.add("hidden");
              wtBtn.classList.add("hidden");
            }

            btnUser.innerText = `👤 ${displayTitle}`;
            document.getElementById("logged-username-input").value = profile?.username || "";
            
            database.ref("stories").once("value", (snap) => {
              renderStoryGrid(snap.val());
            });
          });

          database.ref(`users/${user.uid}/reading_history`).on('value', (snapshot) => {
            const fbHistory = snapshot.val();
            if (fbHistory) {
              localStorage.setItem("wattpad_reading_history", JSON.stringify(fbHistory));
              database.ref("stories").once("value", (snap) => {
                renderReadingHistory(snap.val());
              });
            }
          });
        } else {
          isAdmin = false;
          btnUser.innerText = "👤 Tài khoản";
          formFields.classList.remove("hidden");
          loggedFields.classList.add("hidden");
          edLink.classList.add("hidden");
          wtBtn.classList.add("hidden");

          database.ref("stories").once("value", (snap) => {
            renderStoryGrid(snap.val());
          });
        }
      });

      function toggleNotificationDropdown(e) {
        e.stopPropagation();
        const notiBox = document.getElementById("noti-box");
        const badge = document.getElementById("noti-badge");
        if (notiBox.style.display === "block") {
          notiBox.style.display = "none";
        } else {
          notiBox.style.display = "block";
          badge.classList.add("hidden");
          localStorage.setItem("tramnang_last_seen_noti", new Date().getTime());
        }
      }

      document.addEventListener("click", () => {
        document.getElementById("noti-box").style.display = "none";
      });

      database.ref("announcements").on("value", (snapshot) => {
        const listContainer = document.getElementById("noti-content-list");
        const badge = document.getElementById("noti-badge");
        const data = snapshot.val();

        if (!data) {
          listContainer.innerHTML = '<div class="text-center py-6 text-xs text-stone-400 italic">Chạm chưa có thông báo mới...</div>';
          return;
        }

        listContainer.innerHTML = "";
        const sortedIds = Object.keys(data).sort((a, b) => parseInt(b.replace("id_", "")) - parseInt(a.replace("id_", "")));
        let hasNewNoti = false;
        const lastSeen = localStorage.getItem("tramnang_last_seen_noti") || 0;

        sortedIds.forEach((id) => {
          const item = data[id];
          listContainer.innerHTML += `
                <div class="noti-item">
                    <div class="font-medium text-stone-800">${item.content}</div>
                    <span class="noti-date">🕒 ${item.date || "Vừa xong"}</span>
                </div>
            `;
          if (item.timestamp && item.timestamp > lastSeen) {
            hasNewNoti = true;
          }
        });
        if (hasNewNoti) badge.classList.remove("hidden");
      });

      function renderReadingHistory(allStories) {
        const section = document.getElementById("reading-history-section");
        const grid = document.getElementById("history-list-grid");
        const localHistory = JSON.parse(localStorage.getItem("wattpad_reading_history")) || {};
        if (!Object.keys(localHistory).length || !allStories) {
          section.style.display = "none";
          return;
        }

        let hasValid = false;
        grid.innerHTML = "";
        Object.keys(localHistory).forEach((storyId) => {
          if (allStories[storyId]?.story_info) {
            hasValid = true;
            const story = allStories[storyId].story_info;
            const lastCh = localHistory[storyId].chapter;
            const cover = story.cover || "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
            const chapters = allStories[storyId].chapters;
            const chCount = chapters ? Object.keys(chapters).length : 0;

            let statusLabel = story.status === "completed"
                ? '<span class="text-[10px] bg-green-100 text-green-700 px-1 rounded font-bold flex-shrink-0">✓ Xong</span>'
                : '<span class="text-[10px] bg-amber-100 text-amber-700 px-1 rounded font-bold flex-shrink-0">⏳ Chưa hoàn thành</span>';

            grid.innerHTML += `
                <a href="detail.html?id=${storyId}&ch=${lastCh}" class="book-card">
                    <div class="book-cover">
                        <img src="${cover}" alt="">
                        <div class="history-badge">Ch.${lastCh}</div>
                        <div class="book-badge">
                            <span>${chCount} chương</span>
                        </div>
                    </div>
                    <div class="book-title">${statusLabel} <span class="truncate">${story.title}</span></div>
                    <div class="history-label">Đọc tiếp →</div>
                </a>`;
          }
        });
        section.style.display = hasValid ? "block" : "none";
      }

      function renderStoryGrid(allStories) {
        const grid = document.getElementById("story-list-grid");
        grid.innerHTML = "";
        renderReadingHistory(allStories);

        if (!allStories) {
          if (isAdmin) grid.innerHTML = `<a href="editor.html" class="add-card"><div class="add-content"><div class="add-icon">+</div><div class="add-text">Thêm truyện</div></div></a>`;
          return;
        }

        Object.keys(allStories).forEach((storyId) => {
          const story = allStories[storyId].story_info;
          if (!story) return;
          const cover = story.cover || "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
          const chapters = allStories[storyId].chapters;
          const chCount = chapters ? Object.keys(chapters).length : 0;

          let statusLabel = story.status === "completed"
              ? '<span class="text-[10px] bg-green-100 text-green-700 px-1 rounded font-bold flex-shrink-0">✓ Xong</span>'
              : '<span class="text-[10px] bg-amber-100 text-amber-700 px-1 rounded font-bold flex-shrink-0">⏳ Chưa hoàn thành</span>';

          // 👑 CHÍNH THỨC CHO MẮT XEM CÚT: Ô nhãn màu đen giờ chỉ hiện gọn gàng số chương
          grid.innerHTML += `
            <a href="detail.html?id=${storyId}" class="book-card">
                <div class="book-cover">
                    <img src="${cover}" alt="">
                    <div class="book-badge">
                        <span>${chCount} chương</span>
                    </div>
                </div>
                <div class="book-title">${statusLabel} <span class="truncate">${story.title}</span></div>
                <div class="book-author">${story.author || "Khuyết danh"}</div>
            </a>`;
        });

        if (isAdmin) {
          grid.innerHTML += `<a href="editor.html" class="add-card"><div class="add-content"><div class="add-icon">+</div><div class="add-text">Thêm truyện</div></div></a>`;
        }
      }

      database.ref("stories").on("value", (snapshot) => {
        renderStoryGrid(snapshot.val());
      });
    </script>
  </body>
</html>
