<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Nắng — Không gian đọc truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --cream: #FDFCF9;
            --cream-2: #F5F3EE;
            --ink: #1A1814;
            --ink-2: #4A4640;
            --ink-3: #8C877F;
            --amber: #C27B2A;
            --amber-light: #F5E6D0;
            --border: #E8E4DC;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); }
        .font-lora { font-family: 'Lora', serif; }

        nav { background: var(--cream); border-bottom: 1px solid var(--border); }
        .nav-logo { font-family: 'Lora', serif; font-weight: 600; color: var(--ink); letter-spacing: -0.5px; }
        .nav-link { color: var(--ink-3); font-size: 13px; font-weight: 500; text-decoration: none; transition: color .2s; }
        .nav-link:hover { color: var(--ink); }
        .btn-primary { background: var(--ink); color: white; font-size: 12px; font-weight: 600; padding: 7px 16px; border-radius: 6px; text-decoration: none; transition: background .2s; display: inline-block; }
        .btn-primary:hover { background: var(--ink-2); }

        .hero { background: var(--cream); border-bottom: 1px solid var(--border); padding: 56px 0 48px; }
        .hero-eyebrow { font-size: 11px; font-weight: 600; color: var(--amber); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
        .hero-title { font-family: 'Lora', serif; font-size: 32px; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 10px; }
        .hero-sub { font-size: 14px; color: var(--ink-3); line-height: 1.6; }

        .section-label { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 20px; }

        .book-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; align-items: start; }
        @media (max-width: 900px) { .book-grid { grid-template-columns: repeat(3, 1fr); } }

        .book-card { text-decoration: none; display: block; cursor: pointer; width: 100%; }
        
        /* 👑 KHÓA LIỀN CẤU TRÚC BÌA SÁCH: Cố định tỷ lệ 2/3 hoàn hảo cho mọi khung ảnh */
        .book-cover { 
            width: 100% !important;
            height: 0 !important;
            padding-bottom: 150% !important; /* Tạo tỷ lệ 2:3 chuẩn chỉnh bất chấp ảnh gốc */
            border-radius: 8px; 
            overflow: hidden; 
            margin-bottom: 10px; 
            background: var(--cream-2); 
            border: 1px solid var(--border); 
            position: relative; 
            transition: box-shadow .25s, transform .25s; 
        }
        .book-card:hover .book-cover { box-shadow: 0 8px 24px rgba(0,0,0,.1); transform: translateY(-2px); }
        
        /* Ép ảnh lấp đầy tuyệt đối bên trong không lo méo mó hình dạng */
        .book-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover !important; display: block; }
        
        .book-badge { position: absolute; bottom: 7px; left: 7px; background: rgba(26,24,20,.65); backdrop-filter: blur(6px); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; z-index: 10; }
        .book-title { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-author { font-size: 11px; color: var(--ink-3); }

        .history-badge { position: absolute; top: 7px; left: 7px; background: var(--amber); color: white; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; z-index: 10; }
        .history-label { font-size: 11px; color: var(--amber); font-weight: 600; margin-top: 3px; }

        /* Khóa tỷ lệ cho khung Thêm truyện nét đứt */
        .add-card { 
            width: 100%;
            height: 0;
            padding-bottom: 150%;
            border-radius: 8px; 
            border: 1.5px dashed var(--border); 
            position: relative;
            cursor: pointer; 
            transition: border-color .2s, background .2s; 
            text-decoration: none; 
        }
        .add-card:hover { border-color: var(--amber); background: var(--amber-light); }
        .add-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
        .add-icon { font-size: 20px; color: var(--ink-3); }
        .add-text { font-size: 11px; color: var(--ink-3); font-weight: 500; }

        .reading-mode-pill { display: flex; align-items: center; gap: 6px; background: var(--cream-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 11px; }
        .reading-mode-pill select { background: transparent; border: none; outline: none; color: var(--ink-2); font-weight: 600; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

<nav style="position: sticky; top: 0; z-index: 50;">
    <div style="max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 54px; display: flex; align-items: center; justify-content: space-between;">
        <a href="index.html" class="nav-logo" style="font-size: 18px; text-decoration: none;">Trạm Nắng</a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html" class="nav-link">Khám phá</a>
            <a href="editor.html" class="nav-link">Sáng tác</a>
            <div class="reading-mode-pill">
                <span style="color: var(--ink-3);">Đọc:</span>
                <select id="global-reading-mode" onchange="saveGlobalReadingMode(this.value)">
                    <option value="vertical">Cuộn dọc</option>
                    <option value="horizontal">Lật ngang</option>
                </select>
            </div>
            <a href="editor.html" class="btn-primary">Viết tiếp</a>
        </div>
    </div>
</nav>

<div class="hero">
    <div style="max-width: 1100px; margin: 0 auto; padding: 0 24px;">
        <div class="hero-eyebrow">Kệ sách chữa lành</div>
        <h1 class="hero-title">Nơi những vệt nắng<br>sưởi lành tâm hồn</h1>
        <p class="hero-sub">Góc nhỏ lưu giữ những câu chuyện thành thật và thầm lặng.</p>
    </div>
</div>

<main style="max-width: 1100px; margin: 0 auto; padding: 48px 24px;">

    <div id="reading-history-section" style="display: none; margin-bottom: 52px;">
        <div class="section-label">Đang đọc dở</div>
        <div class="book-grid" id="history-list-grid"></div>
    </div>

    <div>
        <div class="section-label">Tất cả tác phẩm</div>
        <div class="book-grid" id="story-list-grid">
            <div style="grid-column: 1/-1; text-align: center; color: var(--ink-3); padding: 48px 0; font-size: 14px;">Đang kết nối...</div>
        </div>
    </div>

</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function saveGlobalReadingMode(val) { localStorage.setItem('tramnang_default_reading_mode', val); }

    window.addEventListener('DOMContentLoaded', () => {
        const savedMode = localStorage.getItem('tramnang_default_reading_mode') || 'vertical';
        document.getElementById('global-reading-mode').value = savedMode;
    });

    function renderReadingHistory(allStories) {
        const section = document.getElementById('reading-history-section');
        const grid = document.getElementById('history-list-grid');
        const localHistory = JSON.parse(localStorage.getItem('wattpad_reading_history')) || {};
        if (!Object.keys(localHistory).length || !allStories) { section.style.display = 'none'; return; }

        let hasValid = false;
        grid.innerHTML = '';
        Object.keys(localHistory).forEach((storyId) => {
            if (allStories[storyId]?.story_info) {
                hasValid = true;
                const story = allStories[storyId].story_info;
                const lastCh = localHistory[storyId].chapter;
                const cover = story.cover || 'https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500';
                grid.innerHTML += `
                <a href="read.html?id=${storyId}&ch=${lastCh}" class="book-card">
                    <div class="book-cover">
                        <img src="${cover}" alt="">
                        <div class="history-badge">Ch.${lastCh}</div>
                    </div>
                    <div class="book-title">${story.title}</div>
                    <div class="history-label">Đọc tiếp →</div>
                </a>`;
            }
        });
        section.style.display = hasValid ? 'block' : 'none';
    }

    database.ref('stories').on('value', (snapshot) => {
        const grid = document.getElementById('story-list-grid');
        grid.innerHTML = '';
        const allStories = snapshot.val();
        renderReadingHistory(allStories);

        if (!allStories) {
            grid.innerHTML = `<a href="editor.html" class="add-card"><div class="add-content"><div class="add-icon">+</div><div class="add-text">Thêm truyện đầu tay</div></div></a>`;
            return;
        }
        Object.keys(allStories).forEach((storyId) => {
            const story = allStories[storyId].story_info;
            if (!story) return;
            const cover = story.cover || 'https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500';
            const chapters = allStories[storyId].chapters;
            const chCount = chapters ? Object.keys(chapters).length : 0;
            grid.innerHTML += `
            <a href="detail.html?id=${storyId}" class="book-card">
                <div class="book-cover">
                    <img src="${cover}" alt="">
                    <div class="book-badge">${chCount} chương</div>
                </div>
                <div class="book-title">${story.title}</div>
                <div class="book-author">${story.author || 'Khuyết danh'}</div>
            </a>`;
        });
        grid.innerHTML += `<a href="editor.html" class="add-card"><div class="add-content"><div class="add-icon">+</div><div class="add-text">Thêm truyện</div></div></a>`;
    });
</script>
</body>
</html>
