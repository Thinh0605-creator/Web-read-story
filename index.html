<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chạm — Không gian đọc truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
      :root {
        --cream: #fdfcf9;
        --cream-2: #f5f3ee;
        --ink: #1a1814;
        --ink-2: #4a4640;
        --ink-3: #8c877f;
        --amber: #c27b2a;
        --amber-light: #f5e6d0;
        --border: #e8e4dc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--cream);
        color: var(--ink);
      }
      .font-lora {
        font-family: "Lora", serif;
      }

      nav {
        background: var(--cream);
        border-bottom: 1px solid var(--border);
      }
      .nav-logo {
        font-family: "Lora", serif;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.5px;
      }
      .nav-link {
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s;
      }
      .nav-link:hover {
        color: var(--ink);
      }
      .btn-primary {
        background: var(--ink);
        color: white;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 16px;
        border-radius: 6px;
        text-decoration: none;
        transition: background 0.2s;
        display: inline-block;
      }
      .btn-primary:hover {
        background: var(--ink-2);
      }

      .hero {
        background: var(--cream);
        border-bottom: 1px solid var(--border);
        padding: 56px 0 48px;
      }
      .hero-eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: var(--amber);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .hero-title {
        font-family: "Lora", serif;
        font-size: 32px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.3;
        margin-bottom: 10px;
      }
      .hero-sub {
        font-size: 14px;
        color: var(--ink-3);
        line-height: 1.6;
      }

      .section-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .book-card {
        text-decoration: none;
        display: block;
        cursor: pointer;
        width: 100%;
      }

      /* 👑 THUẬT TOÁN RESPONSIVE ĐỘC QUYỀN: Laptop cao 340px, Điện thoại tự co về 240px cực kỳ vừa vặn! */
      .book-cover {
        width: 100% !important;
        height: 240px !important; /* Mặc định trên điện thoại */
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 10px;
        background: var(--cream-2);
        border: 1px solid var(--border);
        position: relative;
        transition:
          box-shadow 0.25s,
          transform 0.25s;
      }
      @media (min-width: 768px) {
        .book-cover {
          height: 340px !important;
        } /* Trên Laptop tự cao lên */
      }
      .book-card:hover .book-cover {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
      }
      .book-cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover !important;
        display: block;
      }

      .book-badge {
        position: absolute;
        bottom: 7px;
        left: 7px;
        background: rgba(26, 24, 20, 0.65);
        backdrop-filter: blur(6px);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 4px;
        z-index: 10;
      }
      .history-badge {
        position: absolute;
        top: 7px;
        left: 7px;
        background: var(--amber);
        color: white;
        font-size: 9px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 4px;
        z-index: 10;
      }
      .history-label {
        font-size: 11px;
        color: var(--amber);
        font-weight: 600;
        margin-top: 3px;
      }
      .book-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .book-author {
        font-size: 11px;
        color: var(--ink-3);
      }

      /* Khung thêm truyện nét đứt tự động co giãn chiều cao theo thiết bị */
      .add-card {
        width: 100%;
        height: 240px !important;
        border-radius: 8px;
        border: 1.5px dashed var(--border);
        position: relative;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
        text-decoration: none;
      }
      @media (min-width: 768px) {
        .add-card {
          height: 340px !important;
        }
      }
      .add-card:hover {
        border-color: var(--amber);
        background: var(--amber-light);
      }
      .add-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .add-icon {
        font-size: 20px;
        color: var(--ink-3);
      }
      .add-text {
        font-size: 11px;
        color: var(--ink-3);
        font-weight: 500;
      }

      .reading-mode-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--cream-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 11px;
      }
      .reading-mode-pill select {
        background: transparent;
        border: none;
        outline: none;
        color: var(--ink-2);
        font-weight: 600;
        cursor: pointer;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <nav style="position: sticky; top: 0; z-index: 50">
      <div
        class="max-w-[1100px] mx-auto px-4 md:px-6 h-[54px] flex items-center justify-between"
      >
        <a
          href="index.html"
          class="nav-logo"
          style="font-size: 18px; text-decoration: none"
          >Chạm</a
        >
        <div style="display: flex; align-items: center; gap: 20px">
          <a href="index.html" class="nav-link hidden md:inline">Khám phá</a>
          <a href="editor.html" class="nav-link">Sáng tác</a>
          <div class="reading-mode-pill hidden md:flex">
            <span style="color: var(--ink-3)">Đọc:</span>
            <select
              id="global-reading-mode"
              onchange="saveGlobalReadingMode(this.value)"
            >
              <option value="vertical">Cuộn dọc</option>
              <option value="horizontal">Lật ngang</option>
            </select>
          </div>
          <a href="editor.html" class="btn-primary">Viết tiếp</a>
        </div>
      </div>
    </nav>

    <div class="hero px-4 text-center md:text-left">
      <div style="max-width: 1100px; margin: 0 auto">
        <div class="hero-eyebrow">Kệ sách chữa lành</div>
        <h1 class="hero-title text-2xl md:text-3xl">
          Nơi những câu truyện thú vị<br />được quan sát qua nhiều vũ trụ khác nhau
        </h1>
        <p class="hero-sub text-xs md:text-sm"></p>
      </div>
    </div>

    <main style="max-width: 1100px; margin: 0 auto" class="px-4 py-8 md:py-12">
      <div
        id="reading-history-section"
        style="display: none"
        class="mb-10 md:mb-14"
      >
        <div class="section-label">Đang đọc dở</div>
        <!-- ⚡ THẦN CHÚ RESPONSIVE: Mặc định điện thoại đi 2 cột, laptop đi 5 cột -->
        <div
          class="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-5 items-start"
          id="history-list-grid"
        ></div>
      </div>

      <div>
        <div class="section-label">Tất cả tác phẩm</div>
        <!-- ⚡ THẦN CHÚ RESPONSIVE: Mặc định điện thoại đi 2 cột, laptop đi 5 cột -->
        <div
          class="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-5 items-start"
          id="story-list-grid"
        >
          <div
            style="
              grid-column: 1/-1;
              text-align: center;
              color: var(--ink-3);
              padding: 48px 0;
              font-size: 14px;
            "
          >
            Đang kết nối...
          </div>
        </div>
      </div>
    </main>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f",
      };
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      function saveGlobalReadingMode(val) {
        localStorage.setItem("tramnang_default_reading_mode", val);
      }

      window.addEventListener("DOMContentLoaded", () => {
        const savedMode =
          localStorage.getItem("tramnang_default_reading_mode") || "vertical";
        const globalSelect = document.getElementById("global-reading-mode");
        if (globalSelect) globalSelect.value = savedMode;
      });

      function renderReadingHistory(allStories) {
        const section = document.getElementById("reading-history-section");
        const grid = document.getElementById("history-list-grid");
        const localHistory =
          JSON.parse(localStorage.getItem("wattpad_reading_history")) || {};
        if (!Object.keys(localHistory).length || !allStories) {
          section.style.display = "none";
          return;
        }

        let hasValid = false;
        grid.innerHTML = "";
        Object.keys(localHistory).forEach((storyId) => {
          if (allStories[storyId]?.story_info) {
            hasValid = true;
            const story = allStories[storyId].story_info;
            const lastCh = localHistory[storyId].chapter;
            const cover =
              story.cover ||
              "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
            const chapters = allStories[storyId].chapters;
            const chCount = chapters ? Object.keys(chapters).length : 0;

            grid.innerHTML += `
                <a href="read.html?id=${storyId}&ch=${lastCh}" class="book-card">
                    <div class="book-cover">
                        <img src="${cover}" alt="">
                        <div class="history-badge">Ch.${lastCh}</div>
                        <div class="book-badge">${chCount} chương</div>
                    </div>
                    <div class="book-title">${story.title}</div>
                    <div class="history-label">Đọc tiếp →</div>
                </a>`;
          }
        });
        section.style.display = hasValid ? "block" : "none";
      }

      database.ref("stories").on("value", (snapshot) => {
        const grid = document.getElementById("story-list-grid");
        grid.innerHTML = "";
        const allStories = snapshot.val();
        renderReadingHistory(allStories);

        if (!allStories) {
          grid.innerHTML = `<a href="editor.html" class="add-card"><div class="add-content"><div class="add-icon">+</div><div class="add-text">Thêm truyện</div></div></a>`;
          return;
        }
        Object.keys(allStories).forEach((storyId) => {
          const story = allStories[storyId].story_info;
          if (!story) return;
          const cover =
            story.cover ||
            "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
          const chapters = allStories[storyId].chapters;
          const chCount = chapters ? Object.keys(chapters).length : 0;
          grid.innerHTML += `
            <a href="detail.html?id=${storyId}" class="book-card">
                <div class="book-cover">
                    <img src="${cover}" alt="">
                    <div class="book-badge">${chCount} chương</div>
                </div>
                <div class="book-title">${story.title}</div>
                <div class="book-author">${story.author || "Khuyết danh"}</div>
            </a>`;
        });
        grid.innerHTML += `<a href="editor.html" class="add-card"><div class="add-content"><div class="add-icon">+</div><div class="add-text">Thêm truyện</div></div></a>`;
      });
    </script>
  </body>
</html>
