<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Đọc Truyện - Chạm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- 👑 NHÚNG THƯ VIỆN SWIPER JS ĐỂ LƯỚT TAY MƯỢT NHƯ WATTPAD -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
      .font-story-serif {
        font-family: "Merriweather", serif;
      }

      .font-story-sans {
        font-family: "Inter", sans-serif;
      }

      /* Style mặc định chế độ cuộn dọc */
      .story-content-wrapper p {
        text-indent: 28px;
        margin-bottom: 1.5rem;
      }

      /* Progress Bar cố định phía trên */
      .progress-container {
        position: fixed;
        top: 45px;
        left: 0;
        width: 100%;
        height: 3px;
        background: transparent;
        z-index: 49;
      }
      @media (min-width: 768px) {
        .progress-container {
          top: 53px;
        }
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: #c27b2a;
        transition: width 0.1s ease-out;
      }

      /* Style riêng cho trang khi lướt ngang dạng Swiper */
      .swiper-slide {
        box-sizing: border-box;
        height: auto;
      }
      .horizontal-page p {
        text-indent: 24px;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body
    class="bg-stone-50 text-stone-900 transition-colors duration-300 min-h-screen flex flex-col overflow-x-hidden"
    id="body"
  >
    <nav
      class="bg-white shadow-sm border-b border-stone-200 sticky top-0 z-50 transition-colors duration-300"
      id="nav-bar"
    >
      <div
        class="max-w-4xl mx-auto px-4 py-2 md:py-3 flex justify-between items-center"
      >
        <a
          href="index.html"
          class="text-lg md:text-xl font-bold text-amber-600 tracking-tighter hidden md:inline"
          id="nav-logo"
          >Chạm</a
        >
        <span
          id="nav-mobile-title"
          class="text-xs font-semibold text-stone-500 md:hidden max-w-[150px] truncate"
          >Đang tải...</span
        >

        <div
          class="flex items-center gap-1.5 md:gap-3 w-full md:w-auto justify-end"
        >
          <div
            class="bg-stone-100 px-2 py-1 md:px-2.5 md:py-1.5 rounded-lg border border-stone-200 text-[11px] md:text-xs font-bold flex items-center gap-1"
            id="menu-select-wrapper"
          >
            <span class="text-stone-500 hidden md:inline">Dạng đọc:</span>
            <select
              id="inline-reading-mode"
              onchange="changeReadingModeAndSave(this.value)"
              class="bg-transparent text-amber-600 outline-none cursor-pointer font-bold"
            >
              <option value="vertical">📜 Cuộn dọc</option>
              <option value="horizontal">↔️ Lật ngang (Swipe)</option>
            </select>
          </div>
          <button
            onclick="toggleGlobalDarkMode()"
            class="px-2.5 py-1 bg-stone-100 border border-stone-200 rounded-lg text-[11px] md:text-xs font-bold text-stone-700 transition"
            id="btn-darkmode"
          >
            🌓 Màu nền
          </button>
          <a
            id="back-to-detail"
            href="index.html"
            class="px-2.5 py-1 bg-stone-100 border border-stone-200 rounded-lg text-[11px] md:text-xs font-bold text-stone-500 hover:text-amber-600 transition text-decoration-none"
            >📑 Mục lục</a
          >
        </div>
      </div>
    </nav>

    <div class="progress-container">
      <div class="progress-bar" id="reading-progress"></div>
    </div>

    <main
      class="max-w-2xl mx-auto px-4 pt-4 pb-24 md:py-10 flex-1 w-full flex flex-col justify-between relative"
    >
      <div
        id="loading"
        class="text-center text-stone-400 py-10 flex-1 font-medium"
      >
        ⏳ Đang kiểm tra quyền truy cập phòng đọc...
      </div>

      <div
        id="story-container"
        class="hidden flex-1 flex flex-col justify-between w-full"
      >
        <div>
          <h1
            id="render-title"
            class="text-2xl md:text-3xl font-bold mb-2 text-center md:text-left text-amber-600 hidden md:block"
          ></h1>
          <p
            id="render-date"
            class="text-sm text-stone-400 mb-4 text-center md:text-left hidden md:block"
          ></p>

          <div
            class="bg-white p-3 rounded-xl border border-stone-200 shadow-sm hidden md:flex flex-wrap gap-4 items-center justify-start text-xs md:text-sm mb-8 font-medium text-stone-600 transition-colors duration-300"
            id="control-panel"
          >
            <div class="flex items-center gap-2">
              <span>Cỡ chữ:</span>
              <button
                onclick="changeFontSize(-2)"
                class="w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold transition text-stone-700"
                id="btn-font-minus"
              >
                A-
              </button>
              <span
                id="font-size-display"
                class="w-10 text-center font-bold text-amber-600"
                >20px</span
              >
              <button
                onclick="changeFontSize(2)"
                class="w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold transition text-stone-700"
                id="btn-font-plus"
              >
                A+
              </button>
            </div>
            <div class="flex items-center gap-2">
              <span>Giãn dòng:</span>
              <button
                onclick="changeLineHeight(-0.2)"
                class="w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold transition text-stone-700"
                id="btn-line-minus"
              >
                ↕-
              </button>
              <span
                id="line-height-display"
                class="w-10 text-center font-bold text-amber-600"
                >1.6</span
              >
              <button
                onclick="changeLineHeight(0.2)"
                class="w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold transition text-stone-700"
                id="btn-line-plus"
              >
                ↕+
              </button>
            </div>

            <div class="flex items-center gap-2">
              <button
                onclick="toggleStoryFontFamily()"
                class="px-2.5 py-1.5 bg-stone-100 hover:bg-stone-200 border border-stone-200 rounded-lg font-bold transition text-stone-700 flex items-center gap-1 text-xs"
                id="btn-change-font-family"
              >
                🔤 Kiểu chữ: Có chân
              </button>
            </div>

            <div
              class="text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded font-bold"
              id="badge-mode"
            >
              📜 Chế độ cuộn dọc
            </div>
          </div>

          <!-- KHUNG RENDER NỘI DUNG CHƯƠNG -->
          <div class="w-full overflow-hidden min-h-[300px]">
            <article
              id="render-content"
              class="story-content-wrapper text-justify md:border-t md:border-stone-200 md:pt-6 transition-all duration-300"
              style="font-size: 19px; line-height: 1.6"
            ></article>
          </div>
        </div>

        <!-- HỆ THỐNG BÌNH LUẬN REAL-TIME -->
        <div
          class="mt-14 border-t border-stone-200 pt-8 pb-4"
          id="comment-section-wrapper"
        >
          <h3
            class="font-semibold text-stone-800 text-sm md:text-base mb-4 flex items-center gap-2"
          >
            💬 Độc giả thảo luận
            <span
              id="comment-count-badge"
              class="bg-stone-200 text-stone-600 px-2 py-0.5 rounded-full text-xs font-bold"
              >0</span
            >
          </h3>

          <div id="comment-form" class="mb-6">
            <div class="flex gap-3 items-start">
              <div
                class="w-8 h-8 bg-amber-600 text-white rounded-full flex items-center justify-center font-bold text-xs shadow-sm flex-shrink-0"
                id="comment-avatar"
              >
                👤
              </div>
              <div class="flex-1">
                <textarea
                  id="comment-input"
                  rows="2"
                  class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-white outline-none focus:border-amber-600 font-medium placeholder-stone-400 resize-none transition"
                  placeholder="Cậu thấy chương truyện này thế nào? Chia sẻ cùng Chạm nhé... ✨"
                ></textarea>
                <div class="flex justify-end mt-2">
                  <button
                    onclick="submitComment()"
                    class="bg-stone-900 text-white font-semibold text-xs px-4 py-2 rounded-lg transition hover:bg-stone-800 shadow-sm"
                  >
                    Gửi bình luận
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div
            id="comment-list"
            class="space-y-4 max-h-[400px] overflow-y-auto pr-1"
          >
            <div class="text-center text-xs text-stone-400 italic py-4">
              Đang tải thảo luận của độc giả...
            </div>
          </div>
        </div>

        <!-- THANH ĐIỀU HƯỚNG CHUYỂN CHƯƠNG -->
        <div
          class="fixed bottom-0 left-0 right-0 md:relative bg-white/90 md:bg-transparent backdrop-blur-md md:backdrop-blur-none border-t border-stone-200 md:border-t md:border-stone-200 px-4 py-3 md:px-0 md:py-0 md:mt-12 flex justify-between items-center z-40 transition-colors duration-300"
          id="navigation-footer"
        >
          <button
            onclick="navigateChapter(-1)"
            id="btn-prev"
            class="px-4 py-2.5 md:py-2 bg-stone-200 rounded-lg hover:bg-stone-300 text-xs md:text-sm font-bold text-stone-700 transition min-w-[110px]"
          >
            ← Chương trước
          </button>
          <span
            id="current-ch-display"
            class="font-bold text-amber-600 text-xs md:text-base"
            >Chương 1</span
          >
          <button
            onclick="navigateChapter(1)"
            id="btn-next"
            class="px-4 py-2.5 md:py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 text-xs md:text-sm font-bold transition min-w-[110px]"
          >
            Chương sau →
          </button>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f",
      };
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      const urlParams = new URLSearchParams(window.location.search);
      const storyId = urlParams.get("id");
      let currentChapter = parseInt(urlParams.get("ch")) || 1;

      let currentFontSize = window.innerWidth < 768 ? 18 : 20;
      let currentLineHeight = 1.6;
      let isDarkMode = false;
      let userAuthenticated = false;
      let activeUsername = "Độc giả";
      let rawStoryContent = ""; // Lưu nội dung thô để switch mode
      let swiperInstance = null; // Quản lý Swiper lướt ngang

      let storyFontType =
        localStorage.getItem("tramnang_story_font_type") || "serif";
      let readingMode =
        localStorage.getItem("tramnang_default_reading_mode") || "vertical";

      if (storyId) {
        document.getElementById("back-to-detail").href =
          `detail.html?id=${storyId}`;
      }

      firebase.auth().onAuthStateChanged((user) => {
        if (!user) {
          userAuthenticated = false;
          localStorage.removeItem("wattpad_reading_history");

          document.getElementById("loading").innerHTML = `
            <div class="p-6 bg-red-50 border border-red-200 text-red-700 rounded-xl max-w-sm mx-auto text-center shadow-sm">
              <p class="font-bold text-sm mb-1">🔐 Cậu chưa đăng nhập tài khoản</p>
              <p class="text-xs text-red-600 leading-relaxed">Vui lòng đăng nhập hoặc đăng ký tài khoản Chạm ở trang chủ để lưu tiến trình đọc nhen! Hệ thống đang đưa cậu quay lại...</p>
            </div>
          `;
          setTimeout(() => {
            window.location.href = "index.html";
          }, 3000);
        } else {
          userAuthenticated = true;

          database
            .ref(`users/${user.uid}/profile`)
            .once("value")
            .then((snap) => {
              const prof = snap.val();
              if (prof && prof.username) {
                activeUsername = prof.username;
                const avt = document.getElementById("comment-avatar");
                if (avt) avt.innerText = prof.username.charAt(0).toUpperCase();
              }
            });

          loadChapter(currentChapter);
          listenToCommentsRealtime();
        }
      });

      function listenToCommentsRealtime() {
        if (!storyId) return;

        database
          .ref(`comments/${storyId}/chuong_${currentChapter}`)
          .on("value", (snapshot) => {
            const listContainer = document.getElementById("comment-list");
            const countBadge = document.getElementById("comment-count-badge");
            const data = snapshot.val();

            if (!data) {
              countBadge.innerText = "0";
              listContainer.innerHTML =
                '<div class="text-center text-xs text-stone-400 italic py-6">Chương này chưa có bình luận nào, cậu mở bát đầu tiên đi nhen! ✨</div>';
              return;
            }

            listContainer.innerHTML = "";
            const keys = Object.keys(data);
            countBadge.innerText = keys.length;
            keys.sort((a, b) => data[b].timestamp - data[a].timestamp);

            keys.forEach((id) => {
              const comment = data[id];
              const timeAgo = formatCommentTime(comment.timestamp);
              const firstLetter = comment.username
                ? comment.username.charAt(0).toUpperCase()
                : "👤";

              listContainer.innerHTML += `
              <div class="flex gap-3 items-start border-b border-stone-100 pb-3 last:border-b-0">
                <div class="w-7 h-7 bg-stone-200 text-stone-600 rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0">
                  ${firstLetter}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-0.5">
                    <span class="text-xs font-bold text-stone-800 truncate">${comment.username}</span>
                    <span class="text-[10px] text-stone-400 font-medium">🕒 ${timeAgo}</span>
                  </div>
                  <p class="text-xs md:text-sm text-stone-600 leading-relaxed break-words font-medium">${comment.content}</p>
                </div>
              </div>
            `;
            });
          });
      }

      function submitComment() {
        const input = document.getElementById("comment-input");
        const content = input.value.trim();

        if (!content) {
          alert("Cậu nhập nội dung thảo luận trước khi bấm gửi nhen! 😉");
          return;
        }

        const commentData = {
          username: activeUsername,
          content: content,
          timestamp: new Date().getTime(),
        };

        database
          .ref(`comments/${storyId}/chuong_${currentChapter}`)
          .push(commentData)
          .then(() => {
            input.value = "";
          })
          .catch((err) =>
            alert("Không gửi được bình luận rồi cậu ơi: " + err.message),
          );
      }

      function formatCommentTime(ts) {
        const diff = new Date().getTime() - ts;
        const mins = Math.floor(diff / 60000);
        const hours = Math.floor(mins / 600);
        const days = Math.floor(hours / 24);

        if (mins < 1) return "Vừa xong";
        if (mins < 60) return mins + " phút trước";
        if (hours < 24) return hours + " giờ trước";
        return days + " ngày trước";
      }

      // CẬP NHẬT THANH TIẾN TRÌNH ĐỌC (PROGRESS BAR)
      function updateReadingProgress() {
        const progressBar = document.getElementById("reading-progress");
        if (!progressBar) return;

        if (readingMode === "horizontal" && swiperInstance) {
          const totalSlides = swiperInstance.slides.length;
          const currentSlide = swiperInstance.activeIndex + 1;
          const percentage =
            totalSlides > 0 ? (currentSlide / totalSlides) * 100 : 0;
          progressBar.style.width = percentage + "%";
        } else {
          const totalHeight =
            document.documentElement.scrollHeight - window.innerHeight;
          const percentage =
            totalHeight > 0 ? (window.scrollY / totalHeight) * 100 : 0;
          progressBar.style.width = percentage + "%";
        }
      }

      window.addEventListener("scroll", updateReadingProgress);

      function applySavedFontFamily() {
        const contentBox = document.getElementById("render-content");
        const fontBtn = document.getElementById("btn-change-font-family");
        if (!contentBox) return;

        if (storyFontType === "sans") {
          contentBox.classList.remove("font-story-serif");
          contentBox.classList.add("font-story-sans");
          if (fontBtn) fontBtn.innerText = "🔤 Kiểu chữ: Không chân";
        } else {
          contentBox.classList.remove("font-story-sans");
          contentBox.classList.add("font-story-serif");
          if (fontBtn) fontBtn.innerText = "🔤 Kiểu chữ: Có chân";
        }
      }

      function toggleStoryFontFamily() {
        storyFontType = storyFontType === "serif" ? "sans" : "serif";
        localStorage.setItem("tramnang_story_font_type", storyFontType);
        applySavedFontFamily();
      }

      function changeReadingModeAndSave(mode) {
        readingMode = mode;
        localStorage.setItem("tramnang_default_reading_mode", mode);
        renderContentByMode();
      }

      // 👑 HÀM XỬ LÝ RENDER NỘI DUNG THEO CHẾ ĐỘ (DỌC HOẶC LƯỚT NGANG CỰC MƯỢT)
      function renderContentByMode() {
        const articleElement = document.getElementById("render-content");
        const badge = document.getElementById("badge-mode");
        document.getElementById("inline-reading-mode").value = readingMode;

        // Xóa instance Swiper cũ nếu có
        if (swiperInstance) {
          swiperInstance.destroy(true, true);
          swiperInstance = null;
        }

        if (readingMode === "horizontal") {
          if (badge) {
            badge.innerText = "↔️ Lật ngang (Swipe)";
            badge.className =
              "text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded font-bold";
          }

          // Tạo khung chứa Swiper
          articleElement.className = "w-full transition-all duration-300";
          articleElement.innerHTML = `
            <div class="swiper story-swiper w-full">
              <div class="swiper-wrapper" id="swiper-target"></div>
            </div>
          `;

          const wrapper = document.getElementById("swiper-target");
          const paragraphs = rawStoryContent
            .split("\n")
            .filter((p) => p.trim() !== "");

          let currentSlideHTML = "";
          let wordCountInSlide = 0;
          // Khoảng 220 - 250 từ là vừa đủ cho 1 trang màn hình điện thoại/máy tính
          const WORDS_PER_PAGE = window.innerWidth < 768 ? 110 : 160;

          paragraphs.forEach((pText, index) => {
            let formattedText = pText
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
              .replace(/\*(.*?)\*/g, "<em>$1</em>");

            currentSlideHTML += `<p class="text-justify indent-6 mb-4">${formattedText}</p>`;
            wordCountInSlide += pText.split(" ").length;

            if (
              wordCountInSlide >= WORDS_PER_PAGE ||
              index === paragraphs.length - 1
            ) {
              const slide = document.createElement("div");
              slide.className = "swiper-slide horizontal-page select-none";
              slide.innerHTML = `<div class="story-page-content" style="font-size: ${currentFontSize}px; line-height: ${currentLineHeight};">${currentSlideHTML}</div>`;
              wrapper.appendChild(slide);

              currentSlideHTML = "";
              wordCountInSlide = 0;
            }
          });

          // Kích hoạt Swiper cảm ứng lướt ngang
          swiperInstance = new Swiper(".story-swiper", {
            direction: "horizontal",
            loop: false,
            speed: 250,
            touchRatio: 1.2,
            on: {
              slideChange: function () {
                updateReadingProgress();
              },
            },
          });

          setTimeout(updateReadingProgress, 100);
        } else {
          // Chế độ Cuộn Dọc truyền thống
          if (badge) {
            badge.innerText = "📜 Chế độ cuộn dọc";
            badge.className =
              "text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded font-bold";
          }

          articleElement.className =
            "story-content-wrapper text-justify md:border-t md:border-stone-200 md:pt-6 transition-all duration-300";
          articleElement.innerHTML = "";

          const paragraphs = rawStoryContent
            .split("\n")
            .filter((p) => p.trim() !== "");
          paragraphs.forEach((pText) => {
            let formattedText = pText
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
              .replace(/\*(.*?)\*/g, "<em>$1</em>");

            const pTag = document.createElement("p");
            pTag.innerHTML = formattedText;
            articleElement.appendChild(pTag);
          });

          articleElement.style.fontSize = currentFontSize + "px";
          articleElement.style.lineHeight = currentLineHeight;
          window.scrollTo(0, 0);
          setTimeout(updateReadingProgress, 100);
        }

        applySavedFontFamily();
      }

      function toggleGlobalDarkMode() {
        isDarkMode = !isDarkMode;
        const body = document.getElementById("body");
        const nav = document.getElementById("nav-bar");
        const menuLink = document.getElementById("back-to-detail");
        const controlPanel = document.getElementById("control-panel");
        const btnDarkMode = document.getElementById("btn-darkmode");
        const footer = document.getElementById("navigation-footer");
        const btnPrev = document.getElementById("btn-prev");
        const menuSelect = document.getElementById("menu-select-wrapper");
        const btnFontFamily = document.getElementById("btn-change-font-family");
        const cWrapper = document.getElementById("comment-section-wrapper");

        if (isDarkMode) {
          body.className =
            "bg-stone-900 text-stone-200 transition-colors duration-300 min-h-screen flex flex-col overflow-x-hidden";
          nav.className =
            "bg-stone-800 shadow-sm border-b border-stone-700 sticky top-0 z-50 transition-colors duration-300";
          menuLink.className =
            "px-2.5 py-1 bg-stone-700 border border-stone-600 rounded-lg text-[11px] md:text-xs font-bold text-stone-300 transition text-decoration-none";
          if (controlPanel)
            controlPanel.className =
              "bg-stone-800 p-3 rounded-xl border border-stone-700 shadow-sm hidden md:flex flex-wrap gap-4 items-center justify-start text-sm mb-8 font-medium text-stone-300 transition-colors duration-300";
          btnDarkMode.className =
            "px-2.5 py-1 bg-stone-700 border border-stone-600 rounded-lg text-[11px] md:text-xs font-bold text-stone-100 transition";
          footer.className =
            "fixed bottom-0 left-0 right-0 md:relative bg-stone-800/90 md:bg-transparent backdrop-blur-md md:backdrop-blur-none border-t border-stone-700 md:border-t border-stone-700 px-4 py-3 md:px-0 md:py-0 md:mt-12 flex justify-between items-center z-40 transition-colors duration-300";
          btnPrev.className =
            "px-4 py-2.5 md:py-2 bg-stone-700 rounded-lg text-xs md:text-sm font-bold text-stone-200 transition min-w-[110px]";
          menuSelect.className =
            "bg-stone-700 px-2 py-1 md:px-2.5 md:py-1.5 rounded-lg border border-stone-600 text-[11px] md:text-xs font-bold flex items-center gap-1";
          if (btnFontFamily)
            btnFontFamily.className =
              "px-2.5 py-1.5 bg-stone-700 hover:bg-stone-600 border border-stone-600 rounded-lg font-bold transition text-stone-100 flex items-center gap-1 text-xs";
          if (cWrapper)
            cWrapper.className = "mt-14 border-t border-stone-700 pt-8 pb-4";
        } else {
          body.className =
            "bg-stone-50 text-stone-900 transition-colors duration-300 min-h-screen flex flex-col overflow-x-hidden";
          nav.className =
            "bg-white shadow-sm border-b border-stone-200 sticky top-0 z-50 transition-colors duration-300";
          menuLink.className =
            "px-2.5 py-1 bg-stone-100 border border-stone-200 rounded-lg text-[11px] md:text-xs font-bold text-stone-500 hover:text-amber-600 transition text-decoration-none";
          if (controlPanel)
            controlPanel.className =
              "bg-white p-3 rounded-xl border border-stone-200 shadow-sm hidden md:flex flex-wrap gap-4 items-center justify-start text-xs md:text-sm mb-8 font-medium text-stone-600 transition-colors duration-300";
          btnDarkMode.className =
            "px-2.5 py-1 bg-stone-100 border border-stone-200 rounded-lg text-[11px] md:text-xs font-bold text-stone-700 transition";
          footer.className =
            "fixed bottom-0 left-0 right-0 md:relative bg-white/90 md:bg-transparent backdrop-blur-md md:backdrop-blur-none border-t border-stone-200 md:border-t md:border-stone-200 px-4 py-3 md:px-0 md:py-0 md:mt-12 flex justify-between items-center z-40 transition-colors duration-300";
          btnPrev.className =
            "px-4 py-2.5 md:py-2 bg-stone-200 rounded-lg hover:bg-stone-300 text-xs md:text-sm font-bold text-stone-700 transition min-w-[110px]";
          menuSelect.className =
            "bg-stone-100 px-2 py-1 md:px-2.5 md:py-1.5 rounded-lg border border-stone-200 text-[11px] md:text-xs font-bold flex items-center gap-1";
          if (btnFontFamily)
            btnFontFamily.className =
              "px-2.5 py-1.5 bg-stone-100 hover:bg-stone-200 border border-stone-200 rounded-lg font-bold transition text-stone-700 flex items-center gap-1 text-xs";
          if (cWrapper)
            cWrapper.className = "mt-14 border-t border-stone-200 pt-8 pb-4";
        }
      }

      function changeFontSize(delta) {
        currentFontSize += delta;
        if (currentFontSize < 16) currentFontSize = 16;
        if (currentFontSize > 32) currentFontSize = 32;
        const display = document.getElementById("font-size-display");
        if (display) display.innerText = currentFontSize + "px";
        renderContentByMode();
      }

      function changeLineHeight(delta) {
        currentLineHeight = parseFloat((currentLineHeight + delta).toFixed(1));
        if (currentLineHeight < 1.4) currentLineHeight = 1.4;
        if (currentLineHeight > 2.4) currentLineHeight = 2.4;
        const display = document.getElementById("line-height-display");
        if (display) display.innerText = currentLineHeight;
        renderContentByMode();
      }

      function loadChapter(chNum) {
        if (!storyId || !userAuthenticated) return;
        document.getElementById("loading").classList.remove("hidden");
        document.getElementById("story-container").classList.add("hidden");
        document.getElementById("current-ch-display").innerText =
          "Chương " + chNum;

        if (parseInt(chNum) === 1) {
          database
            .ref(`stories/${storyId}/story_info/views`)
            .transaction((views) => {
              return (views || 0) + 1;
            });
        }

        const user = firebase.auth().currentUser;
        if (user) {
          const readingHistory =
            JSON.parse(localStorage.getItem("wattpad_reading_history")) || {};
          readingHistory[storyId] = {
            chapter: parseInt(chNum),
            time: new Date().getTime(),
          };
          localStorage.setItem(
            "wattpad_reading_history",
            JSON.stringify(readingHistory),
          );

          database.ref(`users/${user.uid}/reading_history/${storyId}`).set({
            chapter: parseInt(chNum),
            time: new Date().getTime(),
          });
        }

        database
          .ref(`stories/${storyId}/chapters/chuong_${chNum}`)
          .once("value")
          .then((snapshot) => {
            const data = snapshot.val();
            document.getElementById("loading").classList.add("hidden");
            document
              .getElementById("story-container")
              .classList.remove("hidden");

            if (data) {
              document.getElementById("render-title").innerText =
                `Chương ${data.id}: ${data.title}`;
              document.getElementById("nav-mobile-title").innerText =
                `Chương ${data.id}: ${data.title}`;
              document.getElementById("render-date").innerText =
                "Ngày cập nhật: " + (data.date || "Hôm nay");

              rawStoryContent = data.content || "";
              renderContentByMode();
              listenToCommentsRealtime();
            } else {
              document.getElementById("render-title").innerText =
                "Chương chưa ra mắt";
              document.getElementById("nav-mobile-title").innerText =
                "Chương chưa ra mắt";
              document.getElementById("render-content").innerHTML =
                "<p class='text-center text-stone-400 italic py-8'>Bản thảo đang được tác giả cập nhật, cậu quay lại sau nhé! 😉</p>";
            }
          });
      }

      function navigateChapter(direction) {
        currentChapter += direction;
        if (currentChapter < 1) currentChapter = 1;
        window.history.pushState({}, "", `?id=${storyId}&ch=${currentChapter}`);
        loadChapter(currentChapter);
      }
    </script>
  </body>
</html>
