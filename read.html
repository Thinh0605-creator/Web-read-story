<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đọc Truyện - Trạm Nắng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .font-story {
        font-family: "Merriweather", serif;
      }
      .dark-mode {
        background-color: #1a1a1a;
        color: #e0e0e0;
      }
      .dark-mode .bg-white {
        background-color: #2d2d2d;
        color: #f0f0f0;
      }

      .story-content-wrapper p {
        text-indent: 28px;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body
    class="bg-stone-50 text-stone-900 transition-colors duration-300"
    id="body"
  >
    <nav class="bg-white shadow-sm border-b border-stone-200 sticky top-0 z-10">
      <div
        class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center"
      >
        <a
          href="index.html"
          class="text-xl font-bold text-amber-600 tracking-tighter"
          >☀️ TRẠM NẮNG</a
        >
        <div class="flex items-center gap-3">
          <button
            onclick="
              document.getElementById('body').classList.toggle('dark-mode')
            "
            class="p-2 bg-stone-100 dark:bg-stone-800 rounded-full text-sm"
          >
            🌓 Đổi màu nền
          </button>
          <a
            id="back-to-detail"
            href="index.html"
            class="text-sm text-stone-500 hover:text-amber-600"
            >Mục lục</a
          >
        </div>
      </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 py-10">
      <div id="loading" class="text-center text-stone-400 py-10">
        ⏳ Đang lấy nội dung chương...
      </div>

      <div id="story-container" class="hidden">
        <h1
          id="render-title"
          class="text-3xl font-bold mb-2 text-center md:text-left text-amber-600 font-story"
        ></h1>
        <p
          id="render-date"
          class="text-sm text-stone-400 mb-4 text-center md:text-left"
        ></p>

        <div
          class="bg-white p-3 rounded-xl border border-stone-200 shadow-sm flex flex-wrap gap-6 items-center justify-center md:justify-start text-sm mb-8 font-medium text-stone-600"
        >
          <div class="flex items-center gap-2">
            <span>Cỡ chữ:</span>
            <button
              onclick="changeFontSize(-2)"
              class="w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold"
            >
              A-
            </button>
            <span
              id="font-size-display"
              class="w-12 text-center font-bold text-amber-600"
              >20px</span
            >
            <button
              onclick="changeFontSize(2)"
              class="w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold"
            >
              A+
            </button>
          </div>
          <div class="flex items-center gap-2">
            <span>Giãn dòng:</span>
            <button
              onclick="changeLineHeight(-0.2)"
              class="w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold"
            >
              ↕-
            </button>
            <span
              id="line-height-display"
              class="w-12 text-center font-bold text-amber-600"
              >1.8</span
            >
            <button
              onclick="changeLineHeight(0.2)"
              class="w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold"
            >
              ↕+
            </button>
          </div>
        </div>

        <article
          id="render-content"
          class="story-content-wrapper font-story text-justify leading-relaxed border-t border-stone-200 pt-6"
          style="font-size: 20px; line-height: 1.8"
        ></article>

        <div
          class="mt-12 flex justify-between items-center border-t border-stone-200 pt-8"
        >
          <button
            onclick="navigateChapter(-1)"
            id="btn-prev"
            class="px-5 py-2 bg-stone-200 rounded-lg hover:bg-stone-300 text-sm font-semibold text-stone-700"
          >
            ← Chương trước
          </button>
          <span id="current-ch-display" class="font-bold text-amber-600"
            >Chương 1</span
          >
          <button
            onclick="navigateChapter(1)"
            id="btn-next"
            class="px-5 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 text-sm font-semibold"
          >
            Chương sau →
          </button>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f",
      };
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      const urlParams = new URLSearchParams(window.location.search);
      const storyId = urlParams.get("id");
      let currentChapter = parseInt(urlParams.get("ch")) || 1;

      let currentFontSize = 20;
      let currentLineHeight = 1.8;

      if (storyId) {
        document.getElementById("back-to-detail").href =
          `detail.html?id=${storyId}`;
      }

      function changeFontSize(delta) {
        currentFontSize += delta;
        if (currentFontSize < 16) currentFontSize = 16;
        if (currentFontSize > 32) currentFontSize = 32;
        const article = document.getElementById("render-content");
        article.style.fontSize = currentFontSize + "px";
        document.getElementById("font-size-display").innerText =
          currentFontSize + "px";
      }

      function changeLineHeight(delta) {
        currentLineHeight = parseFloat((currentLineHeight + delta).toFixed(1));
        if (currentLineHeight < 1.4) currentLineHeight = 1.4;
        if (currentLineHeight > 2.4) currentLineHeight = 2.4;
        const article = document.getElementById("render-content");
        article.style.lineHeight = currentLineHeight;
        document.getElementById("line-height-display").innerText =
          currentLineHeight;
      }

      function loadChapter(chNum) {
        if (!storyId) return;
        document.getElementById("loading").classList.remove("hidden");
        document.getElementById("story-container").classList.add("hidden");
        document.getElementById("current-ch-display").innerText =
          "Chương " + chNum;

        if (parseInt(chNum) === 1) {
          database
            .ref(`stories/${storyId}/story_info/views`)
            .transaction((views) => {
              return (views || 0) + 1;
            });
        }

        const readingHistory =
          JSON.parse(localStorage.getItem("wattpad_reading_history")) || {};
        readingHistory[storyId] = {
          chapter: parseInt(chNum),
          time: new Date().getTime(),
        };
        localStorage.setItem(
          "wattpad_reading_history",
          JSON.stringify(readingHistory),
        );

        database
          .ref(`stories/${storyId}/chapters/chuong_${chNum}`)
          .once("value")
          .then((snapshot) => {
            const data = snapshot.val();
            document.getElementById("loading").classList.add("hidden");
            document
              .getElementById("story-container")
              .classList.remove("hidden");

            if (data) {
              document.getElementById("render-title").innerText =
                `Chương ${data.id}: ${data.title}`;
              document.getElementById("render-date").innerText =
                "Ngày cập nhật: " + (data.date || "Hôm nay");

              const rawContent = data.content || "";
              const paragraphs = rawContent
                .split("\n")
                .filter((p) => p.trim() !== "");
              const articleElement = document.getElementById("render-content");
              articleElement.innerHTML = "";

              paragraphs.forEach((pText) => {
                const pTag = document.createElement("p");
                pTag.innerText = pText;
                articleElement.appendChild(pTag);
              });
            } else {
              document.getElementById("render-title").innerText =
                "Chương chưa ra mắt";
              document.getElementById("render-date").innerText = "";
              document.getElementById("render-content").innerHTML =
                "<p>Bản thảo đang được tác giả cập nhật, cậu quay lại sau nhé! 😉</p>";
            }
          });
      }

      function navigateChapter(direction) {
        currentChapter += direction;
        if (currentChapter < 1) currentChapter = 1;
        window.history.pushState({}, "", `?id=${storyId}&ch=${currentChapter}`);
        loadChapter(currentChapter);
      }

      loadChapter(currentChapter);
    </script>
  </body>
</html>
