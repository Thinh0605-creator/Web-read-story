<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Tác Phẩm - Trạm Nắng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-story { font-family: 'Merriweather', serif; }
        .blur-bg { filter: blur(20px); transform: scale(1.1); }
    </style>
</head>
<body class="bg-stone-50 text-stone-800">

    <nav class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-amber-600 tracking-tighter">☀️ TRẠM NẮNG</a>
            <a href="index.html" class="text-stone-500 hover:text-amber-600 font-medium">← Quay lại sảnh chung</a>
        </div>
    </nav>

    <div class="w-full bg-stone-900 h-64 md:h-80 relative overflow-hidden flex items-center justify-center">
        <div id="bg-blur" class="absolute inset-0 bg-cover bg-center filter blur-xl opacity-30 scale-110"></div>
        <div class="relative z-10 text-center text-white px-4">
            <h2 id="story-title" class="text-3xl md:text-5xl font-extrabold tracking-tight drop-shadow-md font-story">Đang mở kệ sách...</h2>
            <p id="story-author" class="text-amber-400 font-medium mt-2 text-lg drop-shadow-sm italic"></p>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-3 gap-8 -mt-16 relative z-20">
        <div class="md:col-span-1 flex justify-center md:block">
            <img id="story-cover" src="" alt="Cover" class="w-48 h-72 md:w-full md:h-auto object-cover rounded-2xl shadow-2xl border-4 border-white bg-stone-200">
        </div>

        <div class="md:col-span-2 space-y-8">
            <div class="flex gap-4 justify-center md:justify-start">
                <a id="btn-read-now" href="read.html" class="bg-amber-600 hover:bg-amber-700 text-white px-8 py-3 rounded-full font-bold transition transform hover:scale-105 shadow text-center">
                    📖 Đọc tác phẩm
                </a>
                <button onclick="deleteStoryWithPassword()" class="bg-rose-600 hover:bg-rose-700 text-white px-6 py-3 rounded-full font-bold transition transform hover:scale-105 shadow flex items-center gap-1">
                    🗑️ Hủy bản thảo
                </button>
            </div>

            <section class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-stone-200">
                <h3 class="text-xl font-bold mb-4 text-stone-800 border-b border-stone-100 pb-2 font-story">📝 Tóm tắt nội dung</h3>
                <p id="story-desc" class="text-stone-600 leading-relaxed text-base whitespace-pre-line">Đang đọc dữ liệu cốt truyện...</p>
            </section>

            <section class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-stone-200">
                <h3 class="text-xl font-bold mb-4 text-stone-800 border-b border-stone-100 pb-2 font-story">📌 Danh mục các chương</h3>
                <div id="chapters-list" class="space-y-3"></div>
            </section>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
            authDomain: "web-read-story.firebaseapp.com",
            databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
            projectId: "web-read-story",
            storageBucket: "web-read-story.firebasestorage.app",
            messagingSenderId: "627619633534",
            appId: "1:627619633534:web:428659f610e2eb7c45bb2f"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('id');

        // Khai báo mật mã tác giả dùng chung cho hệ thống
        const MY_SECRET_PASSWORD = "060506";

        if(storyId) {
            document.getElementById('btn-read-now').href = `read.html?id=${storyId}&ch=1`;

            database.ref(`stories/${storyId}/story_info`).once('value').then((snapshot) => {
                const info = snapshot.val();
                if(info) {
                    document.getElementById('story-title').innerText = info.title;
                    document.getElementById('story-author').innerText = "Tác giả: " + (info.author || "Khuyết danh");
                    document.getElementById('story-desc').innerText = info.description || "Tác phẩm chưa có tóm tắt giới thiệu.";
                    document.getElementById('story-cover').src = info.cover;
                    document.getElementById('bg-blur').style.backgroundImage = `url('${info.cover}')`;
                }
            });

            database.ref(`stories/${storyId}/chapters`).on('value', (snapshot) => {
                const listContainer = document.getElementById('chapters-list');
                listContainer.innerHTML = "";
                const chapters = snapshot.val();
                if(!chapters) {
                    listContainer.innerHTML = `<p class="text-stone-400 italic text-sm">Chưa có chương nào được phát hành.</p>`;
                    return;
                }
                const sortedKeys = Object.keys(chapters).sort((a,b) => parseInt(chapters[a].id) - parseInt(chapters[b].id));
                sortedKeys.forEach((chKey) => {
                    const ch = chapters[chKey];
                    const row = `
                        <a href="read.html?id=${storyId}&ch=${ch.id}" class="flex justify-between items-center p-4 bg-stone-50 hover:bg-amber-50/50 border border-stone-200 rounded-xl transition font-medium text-stone-700 hover:text-amber-700">
                            <span>Chương ${ch.id}: ${ch.title}</span>
                            <span class="text-stone-400 text-xs">${ch.date || ''}</span>
                        </a>
                    `;
                    listContainer.innerHTML += row;
                });
            });
        }

        // ĐÃ NÂNG CẤP: HÀM XÓA TRUYỆN CÓ KHÓA MẬT MÃ BẢO VỆ
        function deleteStoryWithPassword() {
            if(!storyId) return;

            // Bước 1: Xác nhận lại ý muốn
            const firstCheck = confirm("⚠️ Cậu có chắc chắn muốn gỡ bỏ hoàn toàn bản thảo này cùng mọi chương truyện không?");
            if (!firstCheck) return;

            // Bước 2: Bắt buộc nhập mật mã phòng sáng tác
            const passwordPrompt = prompt("🔒 Tính năng tối cao! Vui lòng gõ mã PIN tác giả để xác thực quyền gỡ bỏ truyện:");
            
            if (passwordPrompt === MY_SECRET_PASSWORD) {
                // Nhập đúng pass mới tiến hành xóa trên Firebase
                database.ref(`stories/${storyId}`).remove().then(() => {
                    const localHistory = JSON.parse(localStorage.getItem('wattpad_reading_history')) || {};
                    if(localHistory[storyId]) {
                        delete localHistory[storyId];
                        localStorage.setItem('wattpad_reading_history', JSON.stringify(localHistory));
                    }
                    alert("🗑️ Đã xác thực thành công. Bản thảo đã được dọn dẹp sạch sẽ!");
                    window.location.href = "index.html";
                }).catch((error) => {
                    alert("Lỗi hệ thống: " + error.message);
                });
            } else {
                // Nhập sai hoặc nhấn hủy
                alert("❌ Mã PIN không chính xác! Hành vi hủy bản thảo đã bị chặn đứng để bảo vệ an toàn dữ liệu.");
            }
        }
    </script>
</body>
</html>
