<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi Tiết Tác Phẩm - Chạm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #fdfcf9;
        --cream-2: #f5f3ee;
        --ink: #1a1814;
        --ink-2: #4a4640;
        --ink-3: #8c877f;
        --amber: #c27b2a;
        --border: #e8e4dc;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--cream);
        color: var(--ink);
      }
      .font-lora {
        font-family: "Lora", serif;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <nav class="bg-white border-b border-stone-200 sticky top-0 z-50">
      <div
        class="max-w-4xl mx-auto px-4 h-[54px] flex items-center justify-between"
      >
        <a
          href="index.html"
          class="font-lora font-bold text-amber-600 text-lg text-decoration-none"
          >Chạm</a
        >
        <a
          href="index.html"
          class="text-xs font-semibold text-stone-500 hover:text-stone-800 transition text-decoration-none"
          >← Quay lại</a
        >
      </div>
    </nav>

    <!-- Khối Banner Đầu Truyện -->
    <div class="bg-stone-900 text-stone-100 py-16 px-4 transition-colors">
      <div
        class="max-w-4xl mx-auto flex flex-col md:flex-row gap-6 items-center md:items-start relative min-h-[120px]"
      >
        <div
          class="md:pl-[210px] w-full space-y-2 text-center md:text-left flex flex-col justify-center"
        >
          <h2
            id="render-title"
            class="font-lora font-bold text-2xl md:text-3xl leading-tight"
          >
            Đang tải tác phẩm...
          </h2>
          <p id="render-author" class="text-stone-400 text-sm italic"></p>
        </div>
      </div>
    </div>

    <!-- Khối Nội Dung Chính bên dưới -->
    <main
      class="max-w-4xl mx-auto px-4 py-8 w-full flex-1 grid grid-cols-1 md:grid-cols-4 gap-8 relative"
    >
      <!-- Cột trái: Ảnh bìa đè lên banner -->
      <div class="md:col-span-1 -mt-24 md:-mt-32 z-10 w-44 mx-auto md:w-full">
        <div
          class="bg-stone-100 rounded-xl overflow-hidden shadow-lg border border-stone-200 aspect-[3/4] relative"
        >
          <img
            id="render-cover"
            src=""
            alt="Bìa truyện"
            class="w-full h-full object-cover hidden"
          />
          <div
            id="cover-skeleton"
            class="absolute inset-0 bg-stone-200 animate-pulse flex items-center justify-center text-stone-400 text-xs font-medium"
          >
            ⏳
          </div>
        </div>
      </div>

      <!-- Cột phải: Thông tin, tóm tắt và danh sách chương -->
      <div class="md:col-span-3 space-y-6">
        <div class="flex flex-wrap gap-3 items-center">
          <a
            id="btn-start-reading"
            href="#"
            class="px-5 py-2.5 bg-stone-900 text-white rounded-lg text-xs md:text-sm font-bold shadow hover:bg-stone-800 transition text-decoration-none hidden"
          >
            Đọc tác phẩm
          </a>

          <!-- 👑 NÚT THẢ TIM TRUYỆN XIN XẮN -->
          <button
            id="btn-favorite-story"
            onclick="toggleFavoriteStory()"
            class="px-5 py-2.5 bg-white text-stone-700 border border-stone-200 rounded-lg text-xs md:text-sm font-bold shadow-sm hover:bg-stone-50 transition flex items-center gap-1.5 outline-none"
          >
            💖 Lưu tác phẩm
          </button>

          <button
            id="btn-admin-delete"
            onclick="handleDeleteStory()"
            class="px-4 py-2 bg-red-50 text-red-600 border border-red-200 rounded-lg text-xs font-bold hover:bg-red-100 transition outline-none hidden"
          >
            🗑️ Xóa tác phẩm (Admin)
          </button>
        </div>

        <!-- Khung tóm tắt nội dung -->
        <div
          class="bg-white p-5 rounded-xl border border-stone-200 shadow-sm space-y-2"
        >
          <h3
            class="text-xs font-bold text-stone-400 uppercase tracking-wider border-b pb-2"
          >
            Tóm tắt nội dung
          </h3>
          <p
            id="render-summary"
            class="text-sm text-stone-600 leading-relaxed font-medium pt-1"
          >
            Tác phẩm chưa có tóm tắt.
          </p>
        </div>

        <!-- Danh mục chương truyện -->
        <div
          class="bg-white p-5 rounded-xl border border-stone-200 shadow-sm space-y-3"
        >
          <h3
            class="text-xs font-bold text-stone-400 uppercase tracking-wider border-b pb-2"
          >
            Danh mục chương
          </h3>
          <div
            id="chapter-list-container"
            class="divide-y divide-stone-100 max-h-[300px] overflow-y-auto pr-1"
          >
            <div class="text-stone-400 text-xs italic py-4 text-center">
              Đang bốc danh sách chương từ máy chủ...
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f",
      };
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      const urlParams = new URLSearchParams(window.location.search);
      const storyId = urlParams.get("id");

      let currentUid = null;
      let isFavorited = false;

      if (!storyId) {
        alert("Không tìm thấy mã số bộ truyện này rồi cậu ơi!");
        window.location.href = "index.html";
      }

      // 👑 ĐỒNG BỘ REAL-TIME QUYỀN ADMIN & TRẠNG THÁI THẢ TIM CỦA USER
      firebase.auth().onAuthStateChanged((user) => {
        const delBtn = document.getElementById("btn-admin-delete");
        const favBtn = document.getElementById("btn-favorite-story");

        if (user) {
          currentUid = user.uid;

          database.ref(`users/${user.uid}/profile`).on("value", (snapshot) => {
            const profile = snapshot.val();
            const role = profile?.role || "user";

            if (
              user.email === "nguyenhuuthinh0506@gmail.com" ||
              role === "admin"
            ) {
              delBtn.classList.remove("hidden");
            } else {
              delBtn.classList.add("hidden");
            }
          });

          // Lắng nghe xem tài khoản này đã thả tim bộ truyện này chưa
          database
            .ref(`users/${user.uid}/favorites/${storyId}`)
            .on("value", (snapshot) => {
              isFavorited = snapshot.val() === true;
              if (isFavorited) {
                favBtn.innerHTML = "❤️ Đã lưu";
                favBtn.className =
                  "px-5 py-2.5 bg-red-50 text-red-600 border border-red-200 rounded-lg text-xs md:text-sm font-bold shadow-sm hover:bg-red-100 transition flex items-center gap-1.5 outline-none";
              } else {
                favBtn.innerHTML = "💖 Lưu tác phẩm";
                favBtn.className =
                  "px-5 py-2.5 bg-white text-stone-700 border border-stone-200 rounded-lg text-xs md:text-sm font-bold shadow-sm hover:bg-stone-50 transition flex items-center gap-1.5 outline-none";
              }
            });
        } else {
          currentUid = null;
          delBtn.classList.add("hidden");
          favBtn.innerHTML = "💖 Thả tim tác phẩm";
        }
      });

      // 👑 HÀM XỬ LÝ BẤM NÚT THẢ TIM / HỦY THẢ TIM TRUYỆN
      function toggleFavoriteStory() {
        if (!currentUid) {
          alert(
            "Cậu đăng nhập tài khoản Chạm ngoài trang chủ để mở khóa tính năng Thả tim lưu trữ nhen! ✨",
          );
          window.location.href = "index.html";
          return;
        }

        isFavorited = !isFavorited;
        database
          .ref(`users/${currentUid}/favorites/${storyId}`)
          .set(isFavorited ? true : null)
          .then(() => {
            if (isFavorited)
              alert("Đã thêm tác phẩm vào kệ sách yêu thích của cậu! 🥰");
          });
      }

      // Đổ nội dung thông tin truyện
      database.ref(`stories/${storyId}`).on("value", (snapshot) => {
        const data = snapshot.val();
        if (!data || !data.story_info) {
          document.getElementById("render-title").innerText =
            "Tác phẩm không tồn tại hoặc đã bị gỡ bỏ nhen cậu!";
          return;
        }

        const info = data.story_info;
        document.title = info.title + " - Chạm";
        document.getElementById("render-title").innerText = info.title;
        document.getElementById("render-author").innerText =
          "Tác giả: " + (info.author || "Khuyết danh");
        document.getElementById("render-summary").innerText =
          info.summary || "Tác phẩm hiện tại chưa có phần tóm tắt nội dung.";

        const imgElement = document.getElementById("render-cover");
        const skeleton = document.getElementById("cover-skeleton");
        if (info.cover) {
          imgElement.src = info.cover;
          imgElement.onload = () => {
            imgElement.classList.remove("hidden");
            skeleton.classList.add("hidden");
          };
        } else {
          imgElement.src =
            "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";
          imgElement.onload = () => {
            imgElement.classList.remove("hidden");
            skeleton.classList.add("hidden");
          };
        }

        // Đổ danh sách chương
        const chapters = data.chapters;
        const chContainer = document.getElementById("chapter-list-container");
        const readBtn = document.getElementById("btn-start-reading");

        if (!chapters) {
          chContainer.innerHTML =
            '<div class="text-stone-400 text-xs italic py-4 text-center">Tác phẩm này hiện tại chưa có chương nào lên sóng... ⏳</div>';
          readBtn.classList.add("hidden");
          return;
        }

        chContainer.innerHTML = "";
        const chKeys = Object.keys(chapters).sort((a, b) => {
          return (
            parseInt(a.replace("chuong_", "")) -
            parseInt(b.replace("chuong_", ""))
          );
        });

        if (chKeys.length > 0) {
          const firstChNum = chKeys[0].replace("chuong_", "");
          readBtn.href = `read.html?id=${storyId}&ch=${firstChNum}`;
          readBtn.classList.remove("hidden");
        }

        chKeys.forEach((key) => {
          const ch = chapters[key];
          const chNum = key.replace("chuong_", "");
          chContainer.innerHTML += `
            <a href="read.html?id=${storyId}&ch=${chNum}" class="flex justify-between items-center py-3 text-stone-600 hover:text-amber-600 font-medium text-xs md:text-sm text-decoration-none transition">
              <span>Chương ${chNum}: ${ch.title}</span>
              <span class="text-[10px] text-stone-400 font-normal">🕒 ${ch.date || "Mới đây"}</span>
            </a>
          `;
        });
      });

      function handleDeleteStory() {
        if (
          !confirm(
            "Cậu có chắc chắn muốn XÓA VĨNH VIỄN toàn bộ tác phẩm này cùng tất cả các chương và bình luận của nó không? Không rút lại được đâu nha cậu ơi!",
          )
        )
          return;

        // Tiến hành xóa sạch dữ liệu truyện lẫn bình luận liên quan trên Firebase
        database
          .ref(`stories/${storyId}`)
          .remove()
          .then(() => {
            database.ref(`comments/${storyId}`).remove();
            alert("Đã gỡ bỏ toàn bộ tác phẩm thành công!");
            window.location.href = "index.html";
          })
          .catch((err) => alert("Lỗi hệ thống: " + err.message));
      }
    </script>
  </body>
</html>
