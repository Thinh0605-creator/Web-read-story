<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Sáng Tác - Trạm Nắng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@400&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .editor-input:focus {
        outline: none;
      }
      .font-story {
        font-family: "Merriweather", serif;
      }
    </style>
  </head>
  <body
    class="bg-stone-50 text-stone-900 opacity-0 transition-opacity duration-300"
    id="editor-body"
  >
    <div id="auth-modal" class="fixed inset-0 bg-stone-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 transition-all duration-300">
        <div class="bg-white rounded-2xl border border-stone-200 p-6 md:p-8 max-w-sm w-full text-center shadow-2xl">
            <span class="text-4xl block mb-3">🔑</span>
            <h3 class="text-xl font-bold text-stone-800 mb-2 font-story">Phòng sáng tác riêng tư</h3>
            <p class="text-sm text-stone-500 mb-6">Chào cậu! Vui lòng nhập mật mã để mở khóa phiên làm việc của tác giả:</p>
            <input type="password" id="modal-pin-input" placeholder="Nhập mã PIN..." class="w-full border-2 border-stone-200 rounded-xl px-4 py-3 mb-4 text-center text-xl font-bold tracking-widest focus:border-amber-500 outline-none transition bg-stone-50">
            <button onclick="verifyAdminPin()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-bold text-sm transition shadow-md">
                Xác thực quyền tác giả
            </button>
        </div>
    </div>

    <nav
      class="bg-white border-b border-stone-200 sticky top-0 z-50 px-6 py-3 flex justify-between items-center shadow-sm"
    >
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-stone-500 hover:text-stone-700"
          >← Rời khỏi</a
        >
        <span id="save-status" class="text-sm text-amber-600 font-medium"
          >Bước 1: Thiết lập cấu trúc</span
        >
      </div>
      <div>
        <button
          id="btn-publish"
          onclick="publishToFirebase()"
          class="hidden bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-full font-bold text-sm shadow transition"
        >
          🚀 Đăng tải lên mạng
        </button>
      </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-10">
      <div
        id="step-1-container"
        class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8 md:p-12 space-y-6"
      >
        <h2
          class="text-2xl font-bold text-amber-600 border-b border-stone-100 pb-3 font-story"
        >
          ☀️ Khu Vực Quản Lý Sáng Tác
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-stone-400 mb-2"
              >CHỌN BỘ TRUYỆN</label
            >
            <select
              id="story-mode-select"
              onchange="handleStorySelection()"
              class="w-full p-3 border border-stone-200 rounded-xl outline-none bg-white font-medium text-stone-700 focus:border-amber-500"
            >
              <option value="new">🆕 Tạo một bộ truyện mới hoàn toàn</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-stone-400 mb-2"
              >CHỌN CHƯƠNG MUỐN VIẾT TIẾP</label
            >
            <select
              id="chapter-mode-select"
              onchange="handleChapterSelection()"
              class="w-full p-3 border border-stone-200 rounded-xl outline-none bg-white font-medium text-amber-600 focus:border-amber-500"
            >
              <option value="new_chap">➕ Viết một chương mới tinh</option>
            </select>
          </div>
        </div>

        <div id="meta-fields-group" class="space-y-6">
          <div>
            <label class="block text-xs font-bold text-stone-400 mb-2" id="cover-section-title"
              >ẢNH BÌA TRUYỆN</label
            >
            <input
              type="file"
              id="book-cover-file"
              accept="image/*"
              class="hidden"
              onchange="previewImage(this)"
            />
            <div
              onclick="document.getElementById('book-cover-file').click()"
              class="border-2 border-dashed border-stone-300 rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer hover:border-amber-500 hover:bg-amber-50/30 transition min-h-[180px] bg-stone-50 overflow-hidden relative"
            >
              <img
                id="cover-preview"
                class="hidden absolute inset-0 w-full h-full object-contain z-10 bg-white"
                src=""
                alt="Preview"
              />
              <div id="upload-instruction" class="text-center">
                <span class="text-4xl block mb-2">🖼️</span>
                <p class="text-sm font-semibold text-stone-600">
                  Bấm vào để tải ảnh từ máy tính
                </p>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-stone-400 mb-2"
                >TÊN TRUYỆN TỔNG THỂ</label
              >
              <input
                type="text"
                id="book-title"
                class="w-full p-3 border border-stone-200 rounded-xl focus:border-amber-500 outline-none font-bold"
              />
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-400 mb-2"
                >TÊN TÁC GIẢ (BÚT DANH)</label
              >
              <input
                type="text"
                id="book-author"
                class="w-full p-3 border border-stone-200 rounded-xl focus:border-amber-500 outline-none font-bold text-amber-600"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-stone-400 mb-2"
              >TÓM TẮT / GIỚI THIỆU TRUYỆN</label
            >
            <textarea
              id="book-desc"
              class="w-full p-3 border border-stone-200 rounded-xl focus:border-amber-500 outline-none h-28 resize-none"
            ></textarea>
          </div>
        </div>

        <div class="pt-4">
          <button
            onclick="goToStep2()"
            class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-bold shadow transition"
          >
            Tiếp tục: Vào phòng viết bài →
          </button>
        </div>
      </div>

      <div
        id="step-2-container"
        class="hidden bg-white rounded-2xl shadow-sm border border-stone-200 p-8 md:p-12 min-h-[70vh]"
      >
        <button
          onclick="goToStep1()"
          class="text-sm text-stone-400 hover:text-amber-500 mb-4 inline-block"
        >
          ← Quay lại cấu hình
        </button>

        <div class="flex gap-4 mb-4">
          <div class="w-1/3">
            <label class="block text-xs text-stone-400 font-bold mb-1"
              >SỐ CHƯƠNG</label
            >
            <input
              type="number"
              id="chapter-id"
              class="w-full p-2 border border-stone-200 rounded font-bold text-center text-amber-600 shadow-sm"
              min="1"
            />
          </div>
          <div class="w-2/3">
            <label class="block text-xs text-stone-400 font-bold mb-1"
              >TÊN CHƯƠNG</label
            >
            <input
              type="text"
              id="story-title"
              class="w-full p-2 border border-stone-200 rounded font-bold shadow-sm"
              placeholder="Tên chương"
            />
          </div>
        </div>

        <label class="block text-xs text-gray-400 font-bold mb-1"
          >NỘI DUNG CHƯƠNG TRUYỆN</label
        >
        <textarea
          id="story-body"
          class="editor-input w-full min-h-[45vh] text-lg leading-relaxed font-story resize-none border border-stone-200 p-4 rounded-xl shadow-inner"
        ></textarea>
      </div>
    </main>

    <script>
      // ================= HỆ THỐNG POP-UP BẢO MẬT MỚI TOÀN DIỆN =================
      const MY_SECRET_PASSWORD = "060506";

      function checkAdminAccess() {
        const sessionAuth = sessionStorage.getItem("tramnang_admin_session");

        if (sessionAuth === "authenticated") {
          // Nếu đã xác thực trước đó, ẩn modal bảo mật ngay và hiển thị body luôn
          document.getElementById("auth-modal").classList.add("hidden");
          document.getElementById("editor-body").classList.remove("opacity-0");
          loadExistingStories();
        } else {
          // Chưa xác thực thì bắt buộc hiện body mờ và hiện modal lên hàng đầu
          document.getElementById("editor-body").classList.remove("opacity-0");
        }
      }

      function verifyAdminPin() {
        const pinValue = document.getElementById("modal-pin-input").value;
        if (pinValue === MY_SECRET_PASSWORD) {
          sessionStorage.setItem("tramnang_admin_session", "authenticated");
          document.getElementById("auth-modal").classList.add("hidden");
          loadExistingStories();
        } else {
          alert("❌ Mật mã không chính xác! Cậu quay lại trang chủ nha.");
          window.location.href = "index.html";
        }
      }

      // Hỗ trợ gõ Enter khi nhập mã PIN cho mượt mà
      document.getElementById("modal-pin-input")?.addEventListener("keypress", function(e) {
          if (e.key === "Enter") verifyAdminPin();
      });

      window.addEventListener("DOMContentLoaded", checkAdminAccess);
      // =========================================================================

      const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f",
      };
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      let base64ImageString = "";
      let loadedStories = {};

      function loadExistingStories() {
        database
          .ref("stories")
          .once("value")
          .then((snapshot) => {
            const data = snapshot.val();
            if (data) {
              loadedStories = data;
              const select = document.getElementById("story-mode-select");
              // Clear options cũ trừ dòng đầu tiên để tránh bị lặp khi load lại
              select.innerHTML = `<option value="new">🆕 Tạo một bộ truyện mới hoàn toàn</option>`;
              Object.keys(data).forEach((id) => {
                const option = document.createElement("option");
                option.value = id;
                option.innerText = `✍️ Viết tiếp bộ: ${data[id].story_info.title}`;
                select.appendChild(option);
              });
            }
          });
      }

      // ⚙️ CHỈNH SỬA: ĐỔ DỮ LIỆU CŨ RA FORM KHI CHỌN TRUYỆN CŨ ĐỂ CẬP NHẬT BÌA HOẶC THÔNG TIN TỔNG THỂ
      function handleStorySelection() {
        const mode = document.getElementById("story-mode-select").value;
        const chapSelect = document.getElementById("chapter-mode-select");
        const sectionTitle = document.getElementById("cover-section-title");

        chapSelect.innerHTML = `<option value="new_chap">➕ Viết một chương mới tinh</option>`;

        if (mode === "new") {
          sectionTitle.innerText = "ẢNH BÌA TRUYỆN";
          resetFormFields();
        } else {
          // Bốc dữ liệu bộ truyện cũ đổ vào form ngay lập tức để cậu cập nhật khi cần
          const info = loadedStories[mode].story_info;
          if(info) {
              document.getElementById("book-title").value = info.title || "";
              document.getElementById("book-author").value = info.author || "";
              document.getElementById("book-desc").value = info.description || "";
              
              sectionTitle.innerText = "THAY ĐỔI ẢNH BÌA TRUYỆN CŨ (NẾU MUỐN)";
              if (info.cover) {
                  base64ImageString = info.cover;
                  const previewImg = document.getElementById("cover-preview");
                  previewImg.src = info.cover;
                  previewImg.classList.remove("hidden");
                  document.getElementById("upload-instruction").classList.add("hidden");
              }
          }

          const chapters = loadedStories[mode].chapters;
          if (chapters) {
            Object.keys(chapters).forEach((chKey) => {
              const option = document.createElement("option");
              option.value = chapters[chKey].id;
              option.innerText = `📝 Sửa tiếp: Chương ${chapters[chKey].id} - ${chapters[chKey].title}`;
              chapSelect.appendChild(option);
            });
          }
        }
        handleChapterSelection();
      }

      function handleChapterSelection() {
        const storyMode = document.getElementById("story-mode-select").value;
        const chapMode = document.getElementById("chapter-mode-select").value;

        const chIdInput = document.getElementById("chapter-id");
        const chTitleInput = document.getElementById("story-title");
        const chBodyInput = document.getElementById("story-body");

        if (storyMode !== "new" && chapMode !== "new_chap") {
          const chapterData =
            loadedStories[storyMode].chapters["chuong_" + chapMode];
          if (chapterData) {
            chIdInput.value = chapterData.id;
            chIdInput.disabled = true;
            chTitleInput.value = chapterData.title;
            chBodyInput.value = chapterData.content;
            return;
          }
        }

        chIdInput.value = "";
        chIdInput.disabled = false;
        chTitleInput.value = "";
        chBodyInput.value = "";
      }

      function resetFormFields() {
        document.getElementById("book-title").value = "";
        document.getElementById("book-author").value = "";
        document.getElementById("book-desc").value = "";
        document.getElementById("cover-preview").classList.add("hidden");
        document
          .getElementById("upload-instruction")
          .classList.remove("hidden");
        base64ImageString = "";
      }

      function previewImage(input) {
        const file = input.files[0];
        if (file) {
          if (file.size > 1500000) {
            alert("Ảnh nặng quá 1.5MB rồi cậu ơi, đổi tấm khác nhẹ hơn nhé!");
            input.value = "";
            return;
          }
          const reader = new FileReader();
          reader.onload = function (e) {
            base64ImageString = e.target.result;
            const previewImg = document.getElementById("cover-preview");
            previewImg.src = base64ImageString;
            previewImg.classList.remove("hidden");
            document
              .getElementById("upload-instruction")
              .classList.add("hidden");
          };
          reader.readAsDataURL(file);
        }
      }

      function goToStep2() {
        const mode = document.getElementById("story-mode-select").value;
        // Bắt buộc nhập tên truyện và bút danh dù là tạo mới hay đang viết dở để tránh lỗi mất data info
        if (
          (!document.getElementById("book-title").value.trim() ||
            !document.getElementById("book-author").value.trim())
        ) {
          alert("Cậu vui lòng kiểm tra xem tên truyện hoặc tác giả có bị trống không nhé!");
          return;
        }
        document.getElementById("step-1-container").classList.add("hidden");
        document.getElementById("step-2-container").classList.remove("hidden");
        document.getElementById("btn-publish").classList.remove("hidden");
        document.getElementById("save-status").innerText =
          "Bước 2: Viết nội dung chương";
        document.getElementById("save-status").className =
          "text-sm text-green-600 font-medium";
      }

      function goToStep1() {
        document.getElementById("step-2-container").classList.add("hidden");
        document.getElementById("step-1-container").classList.remove("hidden");
        document.getElementById("btn-publish").classList.add("hidden");
        document.getElementById("save-status").innerText =
          "Bước 1: Thiết lập cấu trúc";
        document.getElementById("save-status").className =
          "text-sm text-amber-600 font-medium";
      }

      function publishToFirebase() {
        const mode = document.getElementById("story-mode-select").value;
        const chId = document.getElementById("chapter-id").value;
        const chTitle = document.getElementById("story-title").value.trim();
        const chBody = document.getElementById("story-body").value.trim();

        if (!chId || !chTitle || !chBody) {
          alert("Cậu bổ sung số chương, tên chương và nội dung giùm tớ nha!");
          return;
        }

        document.getElementById("save-status").innerText =
          "⏳ Đang đẩy lên đám mây...";
        let targetStoryId = mode;

        // Bốc thông tin từ form ra, bất kể truyện mới hay truyện cũ đều sẵn sàng cập nhật
        const bTitle = document.getElementById("book-title").value.trim();
        const bAuthor = document.getElementById("book-author").value.trim();
        const bDesc = document.getElementById("book-desc").value.trim();
        const finalCover =
          base64ImageString ||
          "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";

        if (mode === "new") {
          targetStoryId = "story_" + Math.random().toString(36).substr(2, 9);
          database.ref(`stories/${targetStoryId}/story_info`).set({
            title: bTitle,
            author: bAuthor,
            cover: finalCover,
            description: bDesc,
            views: 0,
          });
        } else {
          // ⚙️ ĐÃ NÂNG CẤP: Nếu chọn bộ truyện cũ, ghi đè/cập nhật thông tin mới nhất (kèm ảnh bìa vừa đổi) lên Firebase
          database.ref(`stories/${targetStoryId}/story_info`).update({
            title: bTitle,
            author: bAuthor,
            cover: finalCover,
            description: bDesc
          });
        }

        database.ref(`stories/${targetStoryId}/chapters/chuong_${chId}`).set(
          {
            id: chId,
            title: chTitle,
            content: chBody,
            date: new Date().toLocaleDateString("vi-VN"),
          },
          (error) => {
            if (error) {
              alert("Lỗi: " + error.message);
            } else {
              alert(
                `🎉 Thành công! Dữ liệu chương ${chId} đã được đồng bộ hóa an toàn.`,
              );
              window.location.href = "index.html";
            }
          },
        );
      }
    </script>
  </body>
</html>
