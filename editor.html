<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khu vực sáng tác — Chạm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
      :root {
        --cream: #fdfcf9;
        --cream-2: #f5f3ee;
        --ink: #1a1814;
        --ink-2: #4a4640;
        --ink-3: #8c877f;
        --amber: #c27b2a;
        --amber-light: #f5e6d0;
        --border: #e8e4dc;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--cream);
        color: var(--ink);
      }
      .font-lora {
        font-family: "Lora", serif;
      }
      .cover-drop {
        border: 1.5px dashed var(--border);
        border-radius: 10px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
        background: var(--cream);
        position: relative;
        overflow: hidden;
      }
      .cover-drop:hover {
        border-color: var(--amber);
        background: var(--amber-light);
      }
      .cover-drop img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: white;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col pb-20">
    <nav class="border-b border-stone-200 bg-[#fdfcf9] sticky top-0 z-50">
      <div
        class="max-w-[800px] mx-auto px-4 h-[54px] flex items-center justify-between"
      >
        <a
          href="index.html"
          class="font-lora font-bold text-[18px] text-stone-800 text-decoration-none tracking-tighter"
          >Chạm Studio</a
        >
        <a
          href="index.html"
          class="text-xs font-semibold text-stone-500 hover:text-stone-800 transition text-decoration-none"
          >← Về trang chủ</a
        >
      </div>
    </nav>

    <!-- KHUNG ĐIỀU KHIỂN NGUYÊN BẢN CỦA THỊNH -->
    <main
      id="admin-panel"
      class="hidden max-w-[800px] w-full mx-auto px-4 pt-8"
    >
      <div
        class="bg-white p-6 md:p-8 rounded-xl border border-stone-200 shadow-sm space-y-6"
      >
        <h2 class="font-lora font-bold text-xl text-stone-800">
          Khu vực sáng tác
        </h2>

        <!-- Hàng 1: Chọn bộ truyện và Chọn chương -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label
              class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider"
              >Bộ truyện</label
            >
            <select
              id="story-selector"
              onchange="handleStoryChange(this.value)"
              class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 font-semibold text-stone-700 outline-none focus:border-amber-600 cursor-pointer"
            >
              <option value="new">➕ Tạo bộ truyện mới</option>
            </select>
          </div>
          <div class="space-y-1.5">
            <label
              class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider"
              >Chương</label
            >
            <select
              id="chapter-selector"
              onchange="handleChapterChange(this.value)"
              class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 font-semibold text-amber-700 outline-none focus:border-amber-600 cursor-pointer"
            >
              <option value="new">✍️ Viết chương mới</option>
            </select>
          </div>
        </div>

        <!-- 🖼️ CHÈN ẢNH BÌA TỪ FILE EXPLORER MÁY TÍNH (MÃ HÓA BASE64 CHÍNH CHỦ)[cite: 1] -->
        <div class="space-y-1.5">
          <label
            id="cover-section-title"
            class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider"
            >Ảnh bìa</label
          >
          <input
            type="file"
            id="book-cover-file"
            accept="image/*"
            style="display: none"
            onchange="previewImage(this)"
          />
          <div
            class="cover-drop"
            onclick="document.getElementById('book-cover-file').click()"
          >
            <img id="cover-preview" src="" alt="" style="display: none" />
            <div id="upload-instruction" class="text-center">
              <div class="text-2xl mb-1">🖼️</div>
              <div class="text-xs font-semibold text-stone-400">
                Bấm để chọn ảnh bìa từ máy...
              </div>
            </div>
          </div>
        </div>

        <!-- Hàng 2: Tên truyện và Tác giả -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label
              class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider"
              >Tên truyện</label
            >
            <input
              type="text"
              id="story-title"
              class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 outline-none focus:border-amber-600 font-medium text-stone-800"
            />
          </div>
          <div class="space-y-1.5">
            <label
              class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider"
              >Tác giả / Bút danh</label
            >
            <input
              type="text"
              id="story-author"
              class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 outline-none focus:border-amber-600 font-medium text-stone-800"
            />
          </div>
        </div>

        <!-- Tóm tắt truyện -->
        <div class="space-y-1.5">
          <label
            class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider"
            >Tóm tắt</label
          >
          <textarea
            id="story-summary"
            rows="3"
            class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 outline-none focus:border-amber-600 font-medium text-stone-800 resize-none leading-relaxed"
          ></textarea>
        </div>

        <!-- Trạng thái truyện -->
        <div class="space-y-1.5">
          <label
            class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider"
            >Trạng thái tác phẩm</label
          >
          <select
            id="story-status"
            class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 font-bold text-stone-700 outline-none focus:border-amber-600 cursor-pointer"
          >
            <option value="ongoing">⏳ Chưa hoàn thành</option>
            <option value="completed">✓ Đã hoàn thành</option>
          </select>
        </div>

        <!-- 📢 KHỐI PHÁT THÔNG BÁO HỆ THỐNG ĐỘC LẬP TỪ ADMIN ĐÃ QUAY TRỞ LẠI[cite: 1] -->
        <div class="pt-5 mt-5 border-t border-stone-200/80">
          <label
            class="block text-[10px] font-bold text-amber-600 uppercase tracking-wider mb-2"
            >📢 Gửi thông báo toàn hệ thống (Admin)</label
          >
          <textarea
            id="adminNotification"
            rows="2"
            class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 outline-none focus:border-amber-600 font-medium text-stone-800 resize-none leading-relaxed"
            placeholder="Nhập nội dung tâm sự hoặc thông báo dừng/cập nhật truyện gửi tới độc giả tại đây..."
          ></textarea>
          <div class="mt-2 flex justify-start">
            <button
              onclick="sendAdminNotification()"
              class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-4 py-2 rounded-lg shadow-sm transition"
            >
              📢 Phát thông báo ngay
            </button>
          </div>
        </div>

        <!-- KHU VỰC SOẠN NỘI DUNG CHƯƠNG TRUYỆN -->
        <div class="border-t border-stone-200/80 pt-6 space-y-4">
          <h3
            id="chapter-editor-title"
            class="font-lora font-bold text-base text-stone-800"
          >
            Soạn thảo chương
          </h3>

          <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div class="space-y-1.5">
              <label
                class="block text-[10px] font-bold text-stone-400 tracking-wider uppercase"
                >Số chương</label
              >
              <input
                type="number"
                id="chapter-number"
                class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 outline-none focus:border-amber-600 font-bold text-stone-800"
              />
            </div>
            <div class="sm:col-span-3 space-y-1.5">
              <label
                class="block text-[10px] font-bold text-stone-400 tracking-wider uppercase"
                >Tiêu đề chương</label
              >
              <input
                type="text"
                id="chapter-title"
                class="w-full border border-stone-200 rounded-lg p-2.5 text-xs bg-stone-50 outline-none focus:border-amber-600 font-medium text-stone-800"
              />
            </div>
          </div>

          <div class="space-y-1.5">
            <label
              class="block text-[10px] font-bold text-stone-400 tracking-wider uppercase"
              >Nội dung truyện</label
            >
            <textarea
              id="chapter-content"
              style="min-height: 380px"
              class="w-full border border-stone-200 rounded-lg p-3 text-sm bg-stone-50 outline-none focus:border-amber-600 font-medium text-stone-800 resize-none leading-relaxed"
            ></textarea>
          </div>
        </div>

        <!-- Nút bấm đồng bộ truyện -->
        <div class="pt-2 flex justify-end">
          <button
            onclick="handlePublishAction()"
            class="bg-stone-900 hover:bg-stone-800 text-white font-bold text-xs px-6 py-3 rounded-lg shadow transition"
          >
            🚀 Cập nhật hệ thống / Phát hành bản thảo
          </button>
        </div>
      </div>
    </main>

    <div
      id="access-denied"
      class="hidden flex-1 flex items-center justify-center p-4"
    >
      <div
        class="text-center p-8 bg-red-50 border border-red-200 rounded-xl max-w-sm w-full shadow-sm"
      >
        <p class="text-xl mb-1">🔒</p>
        <p class="font-bold text-stone-800 text-sm mb-1">
          Khu vực cấm: Studio của Chủ Tiệm
        </p>
        <p class="text-xs text-red-600 leading-relaxed">
          Chỉ tài khoản Admin tối cao mới được vào phòng sáng tác. Đang quay
          xe...
        </p>
      </div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
        authDomain: "web-read-story.firebaseapp.com",
        databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/",
        projectId: "web-read-story",
        storageBucket: "web-read-story.firebasestorage.app",
        messagingSenderId: "627619633534",
        appId: "1:627619633534:web:428659f610e2eb7c45bb2f",
      };
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      let globalStoriesCache = null;
      let base64ImageString = "";

      firebase.auth().onAuthStateChanged((user) => {
        const panel = document.getElementById("admin-panel");
        const denied = document.getElementById("access-denied");

        if (user) {
          database.ref(`users/${user.uid}/profile`).on("value", (snapshot) => {
            const profile = snapshot.val();
            const role = profile?.role || "user";

            if (
              user.email === "nguyenhuuthinh0506@gmail.com" ||
              role === "admin"
            ) {
              panel.classList.remove("hidden");
              denied.classList.add("hidden");
              loadStoriesToSelector();
            } else {
              kickOutUser();
            }
          });
        } else {
          kickOutUser();
        }
      });

      function kickOutUser() {
        document.getElementById("admin-panel").classList.add("hidden");
        document.getElementById("access-denied").classList.remove("hidden");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 3000);
      }

      // 👑 HÀM GỬI THÔNG BÁO HỆ THỐNG THỦ CÔNG TỪ Ô NHẬP[cite: 1]
      function sendAdminNotification() {
        const msgText = document
          .getElementById("adminNotification")
          .value.trim(); //[cite: 1]
        if (!msgText) {
          //[cite: 1]
          alert("Cậu chưa viết nội dung thông báo kìa! 😉"); //[cite: 1]
          return; //[cite: 1]
        } //[cite: 1]

        const today = new Date(); //[cite: 1]
        const dateStr =
          today.getDate() +
          "/" +
          (today.getMonth() + 1) +
          "/" +
          today.getFullYear(); //[cite: 1]
        const currentTimeMillis = today.getTime(); //[cite: 1]
        const notiId = "id_" + currentTimeMillis; //[cite: 1]

        database
          .ref(`announcements/${notiId}`)
          .set({
            //[cite: 1]
            content: `📢 [Thông báo hệ thống]: ${msgText}`, //[cite: 1]
            date: dateStr, //[cite: 1]
            timestamp: currentTimeMillis, //[cite: 1]
          })
          .then(() => {
            //[cite: 1]
            alert(
              "Đã bắn thông báo độc lập tới toàn bộ chuông người đọc thành công! 🎉",
            ); //[cite: 1]
            document.getElementById("adminNotification").value = ""; // Gửi xong dọn sạch ô[cite: 1]
          })
          .catch((err) => alert("Lỗi: " + err.message)); //[cite: 1]
      }

      function previewImage(input) {
        const file = input.files[0]; //[cite: 1]
        if (!file) return; //[cite: 1]
        if (file.size > 1500000) {
          //[cite: 1]
          alert("Ảnh quá 1.5MB, chọn ảnh nhẹ hơn nhé!"); //[cite: 1]
          input.value = ""; //[cite: 1]
          return; //[cite: 1]
        } //[cite: 1]
        const reader = new FileReader(); //[cite: 1]
        reader.onload = (e) => {
          //[cite: 1]
          base64ImageString = e.target.result; //[cite: 1]
          const img = document.getElementById("cover-preview"); //[cite: 1]
          img.src = base64ImageString; //[cite: 1]
          img.style.display = "block"; //[cite: 1]
          document.getElementById("upload-instruction").style.display = "none"; //[cite: 1]
        }; //[cite: 1]
        reader.readAsDataURL(file); //[cite: 1]
      }

      function loadStoriesToSelector() {
        database.ref("stories").on("value", (snapshot) => {
          const data = snapshot.val();
          globalStoriesCache = data;

          const selector = document.getElementById("story-selector");
          const currentVal = selector.value;

          selector.innerHTML =
            '<option value="new">➕ Tạo bộ truyện mới</option>';

          if (data) {
            Object.keys(data).forEach((id) => {
              const info = data[id].story_info;
              if (info) {
                selector.innerHTML += `<option value="${id}">Viết tiếp: ${info.title}</option>`;
              }
            });
          }
          selector.value = currentVal;
          if (selector.value !== "new") {
            updateChapterSelector(selector.value);
          }
        });
      }

      function handleStoryChange(storyId) {
        const idWrapper = document.getElementById("story-id-wrapper");
        const chSelector = document.getElementById("chapter-selector");

        clearAllFields();

        document.getElementById("cover-section-title").innerText =
          storyId === "new" ? "ẢNH BÌA" : "THAY ĐỔI ẢNH BÌA (TÙY CHỌN)"; //[cite: 1]

        if (storyId === "new") {
          idWrapper.style.display = "block";
          chSelector.innerHTML =
            '<option value="new">✍️ Viết chương mới</option>';
          document.getElementById("chapter-editor-title").innerText =
            "Soạn thảo chương";
        } else {
          idWrapper.style.display = "none";
          document.getElementById("story-id").value = storyId;

          const story = globalStoriesCache[storyId];
          if (story && story.story_info) {
            const info = story.story_info;
            document.getElementById("story-title").value = info.title || "";
            document.getElementById("story-author").value =
              info.author || "Mạc Hà";
            document.getElementById("story-status").value =
              info.status || "ongoing";
            document.getElementById("story-summary").value =
              info.summary || info.description || "";

            if (info.cover) {
              //[cite: 1]
              base64ImageString = info.cover; //[cite: 1]
              const img = document.getElementById("cover-preview"); //[cite: 1]
              img.src = info.cover; //[cite: 1]
              img.style.display = "block"; //[cite: 1]
              document.getElementById("upload-instruction").style.display =
                "none"; //[cite: 1]
            }
          }
          updateChapterSelector(storyId);
        }
      }

      function updateChapterSelector(storyId) {
        const selector = document.getElementById("chapter-selector");
        const currentVal = selector.value;

        selector.innerHTML = '<option value="new">✍️ Viết chương mới</option>';

        const story = globalStoriesCache[storyId];
        if (story && story.chapters) {
          const chKeys = Object.keys(story.chapters).sort((a, b) => {
            return (
              parseInt(a.replace("chuong_", "")) -
              parseInt(b.replace("chuong_", ""))
            );
          });

          chKeys.forEach((key) => {
            selector.innerHTML += `<option value="${key}">Chương ${key.replace("chuong_", "")} — ${story.chapters[key].title}</option>`;
          });
        }
        selector.value = currentVal;
      }

      function handleChapterChange(chKey) {
        const storyId = document.getElementById("story-selector").value;
        const titleHeader = document.getElementById("chapter-editor-title");

        if (chKey === "new") {
          document.getElementById("chapter-number").value = "";
          document.getElementById("chapter-title").value = "";
          document.getElementById("chapter-content").value = "";
          titleHeader.innerText = "Soạn thảo chương";
        } else {
          const chNum = chKey.replace("chuong_", "");
          titleHeader.innerText = `Chỉnh sửa Chương ${chNum}`;

          if (
            storyId !== "new" &&
            globalStoriesCache[storyId]?.chapters?.[chKey]
          ) {
            const chData = globalStoriesCache[storyId].chapters[chKey];
            document.getElementById("chapter-number").value = chNum;
            document.getElementById("chapter-title").value = chData.title || "";
            document.getElementById("chapter-content").value =
              chData.content || "";
          }
        }
      }

      function clearAllFields() {
        document.getElementById("story-id").value = "";
        document.getElementById("story-title").value = "";
        document.getElementById("story-author").value = "Mạc Hà";
        document.getElementById("story-summary").value = "";
        document.getElementById("story-status").value = "ongoing";

        document.getElementById("cover-preview").style.display = "none"; //[cite: 1]
        document.getElementById("upload-instruction").style.display = "flex"; //[cite: 1]
        document.getElementById("book-cover-file").value = "";
        base64ImageString = ""; //[cite: 1]

        document.getElementById("chapter-number").value = "";
        document.getElementById("chapter-title").value = "";
        document.getElementById("chapter-content").value = "";
      }

      function handlePublishAction() {
        const selectStoryMode = document.getElementById("story-selector").value;
        let storyId = document.getElementById("story-id").value.trim();
        const title = document.getElementById("story-title").value.trim();
        const author = document.getElementById("story-author").value.trim();
        const status = document.getElementById("story-status").value;
        const summary = document.getElementById("story-summary").value.trim();

        const chNum = document.getElementById("chapter-number").value.trim();
        const chTitle = document.getElementById("chapter-title").value.trim();
        const chContent = document.getElementById("chapter-content").value;

        if (selectStoryMode === "new" && !storyId) {
          storyId = "story_" + Math.random().toString(36).substr(2, 9); //[cite: 1]
        }

        if (!storyId || !title || !chNum || !chTitle || !chContent) {
          alert(
            "Điền đầy đủ Mã số, Tên truyện, Số chương, Tiêu đề chương và Câu chữ giùm tớ nhen!",
          );
          return;
        }

        const today = new Date();
        const dateStr =
          today.getDate() +
          "/" +
          (today.getMonth() + 1) +
          "/" +
          today.getFullYear();

        const coverToSave =
          base64ImageString ||
          "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500"; //[cite: 1]

        database
          .ref(`stories/${storyId}/story_info`)
          .set({
            title: title,
            author: author || "Mạc Hà",
            cover: coverToSave,
            status: status,
            summary: summary,
            description: summary,
          })
          .then(() => {
            database
              .ref(`stories/${storyId}/chapters/chuong_${chNum}`)
              .set({
                id: parseInt(chNum),
                title: chTitle,
                content: chContent,
                date: dateStr,
              })
              .then(() => {
                // Tự động bắn kèm một thông báo cập nhật chương mới lên hệ thống giống file gốc[cite: 1]
                const currentTimeMillis = today.getTime();
                const autoNotiId = "id_" + currentTimeMillis;
                database
                  .ref(`announcements/${autoNotiId}`)
                  .set({
                    content: `📚 Tác phẩm "${title}" vừa được cập nhật Chương ${chNum}: ${chTitle} nhen cậu ơi!`,
                    date: dateStr,
                    timestamp: currentTimeMillis,
                  })
                  .then(() => {
                    alert(
                      `🚀 Toàn bộ tác phẩm và Chương ${chNum} đã được đăng tải và phát thông báo tự động thành công!`,
                    );
                    document.getElementById("chapter-selector").value = "new";
                    handleChapterChange("new");
                  });
              });
          })
          .catch((err) => alert("Lỗi: " + err.message));
      }
    </script>
  </body>
</html>
