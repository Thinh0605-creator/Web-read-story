<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Sáng Tác - Viết Tiếp Bản Thảo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@400&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .editor-input:focus { outline: none; }
        .font-story { font-family: 'Merriweather', serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="bg-white border-b sticky top-0 z-50 px-6 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-gray-500 hover:text-gray-700">← Rời khỏi</a>
            <span id="save-status" class="text-sm text-orange-500 font-medium">Bước 1: Thiết lập cấu trúc</span>
        </div>
        <div>
            <button id="btn-publish" onclick="publishToFirebase()" class="hidden bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-full font-bold text-sm shadow transition">
                🚀 Đăng tải lên mạng
            </button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-10">
        
        <div id="step-1-container" class="bg-white rounded-2xl shadow-sm border p-8 md:p-12 space-y-6">
            <h2 class="text-2xl font-bold text-orange-600 border-b pb-3">✍️ Khu Vực Quản Lý Sáng Tác</h2>
            
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2">CHẾ ĐỘ SÁNG TÁC</label>
                <select id="story-mode-select" onchange="toggleStoryMode()" class="w-full p-3 border rounded-xl outline-none bg-white font-medium text-gray-700 focus:border-orange-500">
                    <option value="new">🆕 Tạo một bộ truyện mới hoàn toàn</option>
                </select>
            </div>

            <div id="meta-fields-group" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2">ẢNH BÌA TRUYỆN</label>
                    <input type="file" id="book-cover-file" accept="image/*" class="hidden" onchange="previewImage(this)">
                    <div onclick="document.getElementById('book-cover-file').click()" class="border-2 border-dashed border-gray-300 rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 hover:bg-orange-50/30 transition min-h-[180px] bg-gray-50 overflow-hidden relative">
                        <img id="cover-preview" class="hidden absolute inset-0 w-full h-full object-contain z-10 bg-white" src="" alt="Preview">
                        <div id="upload-instruction" class="text-center">
                            <span class="text-4xl block mb-2">🖼️</span>
                            <p class="text-sm font-semibold text-gray-600">Bấm vào để tải ảnh từ máy tính</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2">TÊN TRUYỆN TỔNG THỂ</label>
                        <input type="text" id="book-title" class="w-full p-3 border rounded-xl focus:border-orange-500 outline-none font-bold" placeholder="Ví dụ: Khi nắng ghé qua cửa sổ...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2">TÊN TÁC GIẢ (BÚT DANH)</label>
                        <input type="text" id="book-author" class="w-full p-3 border rounded-xl focus:border-orange-500 outline-none font-bold text-orange-600" placeholder="Ví dụ: Mạc Hà...">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2">TÓM TẮT / GIỚI THIỆU TRUYỆN</label>
                    <textarea id="book-desc" class="w-full p-3 border rounded-xl focus:border-orange-500 outline-none h-28 resize-none" placeholder="Viết giới thiệu ngắn..."></textarea>
                </div>
            </div>

            <div class="pt-4">
                <button onclick="goToStep2()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold shadow transition">
                    Tiếp tục: Viết nội dung chương →
                </button>
            </div>
        </div>

        <div id="step-2-container" class="hidden bg-white rounded-2xl shadow-sm border p-8 md:p-12 min-h-[70vh]">
            <button onclick="goToStep1()" class="text-sm text-gray-400 hover:text-orange-500 mb-4 inline-block">← Quay lại cấu hình</button>

            <div class="flex gap-4 mb-4">
                <div class="w-1/3">
                    <label class="block text-xs text-gray-400 font-bold mb-1">SỐ CHƯƠNG (Chỉ điền số)</label>
                    <input type="number" id="chapter-id" class="w-full p-2 border rounded font-bold text-center text-orange-600" placeholder="Ví dụ: 1" min="1">
                </div>
                <div class="w-2/3">
                    <label class="block text-xs text-gray-400 font-bold mb-1">TÊN CHƯƠNG (Không cần gõ chữ Chương)</label>
                    <input type="text" id="story-title" class="w-full p-2 border rounded font-bold" placeholder="Ví dụ: Thư viện không tên">
                </div>
            </div>
            
            <label class="block text-xs text-gray-400 font-bold mb-1">NỘI DUNG CHƯƠNG TRUYỆN</label>
            <textarea id="story-body" class="editor-input w-full min-h-[45vh] text-lg leading-relaxed font-story resize-none border p-4 rounded-xl" placeholder="Thỏa sức sáng tác nội dung chương tại đây..."></textarea>
        </div>

    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyArxUa4X2Y5HQO_pE94W8Ym_NRr2cEsUEs",
            authDomain: "web-read-story.firebaseapp.com",
            databaseURL: "https://web-read-story-default-rtdb.firebaseio.com/", 
            projectId: "web-read-story",
            storageBucket: "web-read-story.firebasestorage.app",
            messagingSenderId: "627619633534",
            appId: "1:627619633534:web:428659f610e2eb7c45bb2f"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let base64ImageString = "";
        let loadedStories = {};

        function loadExistingStories() {
            database.ref('stories').once('value').then((snapshot) => {
                const data = snapshot.val();
                if(data) {
                    loadedStories = data;
                    const select = document.getElementById('story-mode-select');
                    Object.keys(data).forEach((id) => {
                        const option = document.createElement('option');
                        option.value = id;
                        option.innerText = `✍️ Viết tiếp bộ: ${data[id].story_info.title}`;
                        select.appendChild(option);
                    });
                }
            });
        }
        window.addEventListener('DOMContentLoaded', loadExistingStories);

        function toggleStoryMode() {
            const mode = document.getElementById('story-mode-select').value;
            const metaGroup = document.getElementById('meta-fields-group');
            if (mode === 'new') {
                metaGroup.classList.remove('hidden');
                document.getElementById('book-title').value = "";
                document.getElementById('book-author').value = "";
                document.getElementById('book-desc').value = "";
                document.getElementById('cover-preview').classList.add('hidden');
                document.getElementById('upload-instruction').classList.remove('hidden');
                base64ImageString = "";
            } else {
                metaGroup.classList.add('hidden');
            }
        }

        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                if(file.size > 1500000) {
                    alert("Ảnh nặng quá 1.5MB rồi cậu ơi, đổi tấm khác nhẹ hơn nhé!");
                    input.value = ""; return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64ImageString = e.target.result;
                    const previewImg = document.getElementById('cover-preview');
                    previewImg.src = base64ImageString;
                    previewImg.classList.remove('hidden');
                    document.getElementById('upload-instruction').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function goToStep2() {
            const mode = document.getElementById('story-mode-select').value;
            if(mode === 'new' && (!document.getElementById('book-title').value.trim() || !document.getElementById('book-author').value.trim())) {
                alert("Cậu vui lòng nhập tên truyện và bút danh tác giả nhé!");
                return;
            }
            document.getElementById('step-1-container').classList.add('hidden');
            document.getElementById('step-2-container').classList.remove('hidden');
            document.getElementById('btn-publish').classList.remove('hidden');
            document.getElementById('save-status').innerText = "Bước 2: Viết nội dung chương";
            document.getElementById('save-status').className = "text-sm text-green-500 font-medium";
        }

        function goToStep1() {
            document.getElementById('step-2-container').classList.add('hidden');
            document.getElementById('step-1-container').classList.remove('hidden');
            document.getElementById('btn-publish').classList.add('hidden');
            document.getElementById('save-status').innerText = "Bước 1: Thiết lập cấu trúc";
            document.getElementById('save-status').className = "text-sm text-orange-500 font-medium";
        }

        function publishToFirebase() {
            const mode = document.getElementById('story-mode-select').value;
            const chId = document.getElementById('chapter-id').value;
            const chTitle = document.getElementById('story-title').value.trim();
            const chBody = document.getElementById('story-body').value.trim(); // Thêm .trim() tránh check lỗi ký tự trống

            if(!chId || !chTitle || !chBody) {
                alert("Cậu bổ sung số chương, tên chương và nội dung giùm tớ nha!");
                return;
            }

            document.getElementById('save-status').innerText = "⏳ Đang đẩy lên đám mây...";
            let targetStoryId = mode;

            if (mode === 'new') {
                targetStoryId = 'story_' + Math.random().toString(36).substr(2, 9);
                const bTitle = document.getElementById('book-title').value.trim();
                const bAuthor = document.getElementById('book-author').value.trim();
                const bDesc = document.getElementById('book-desc').value.trim();
                const finalCover = base64ImageString || "https://images.unsplash.com/photo-1543004218-ee141104595e?auto=format&fit=crop&q=80&w=500";

                database.ref(`stories/${targetStoryId}/story_info`).set({
                    title: bTitle,
                    author: bAuthor,
                    cover: finalCover,
                    description: bDesc,
                    views: 0
                });
            }

            // Lưu trực tiếp phần thô lên mạng để các trang đọc tự cấu trúc chuỗi ghép chữ
            database.ref(`stories/${targetStoryId}/chapters/chuong_${chId}`).set({
                id: chId,
                title: chTitle,
                content: chBody,
                date: new Date().toLocaleDateString('vi-VN')
            }, (error) => {
                if (error) {
                    alert("Lỗi: " + error.message);
                } else {
                    alert(`🎉 Xuất sắc! Chương ${chId} đã xuất bản thành công!`);
                    window.location.href = "index.html";
                }
            });
        }
    </script>
</body>
</html>
